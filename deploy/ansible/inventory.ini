# Fill in the real host/IP, SSH user, and key path for each target instance
# before running - the values below are placeholders, not defaults for any
# particular cloud provider.
#
# Single-host deployment: put one host in both [control] and [worker].
# Two-host deployment: put the runner/site/postgres/etc. host in [control]
# and the worker-only host in [worker] - see group_vars/control.yml and
# group_vars/worker.yml for what differs between them.
[control]
instance1 ansible_host=CHANGEME ansible_user=CHANGEME ansible_ssh_private_key_file=CHANGEME

[worker]
instance1 ansible_host=CHANGEME ansible_user=CHANGEME ansible_ssh_private_key_file=CHANGEME

[janitor:children]
control
worker
