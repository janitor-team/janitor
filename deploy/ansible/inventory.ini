# Fill in the real host, SSH user and key path before running.
#
# Single host: put the same host in both groups.
# Several hosts: [control] runs the janitor services, PostgreSQL, Redis
# and Caddy; [worker] runs janitor-worker.
[control]
instance1 ansible_host=CHANGEME ansible_user=CHANGEME ansible_ssh_private_key_file=CHANGEME

[worker]
instance1 ansible_host=CHANGEME ansible_user=CHANGEME ansible_ssh_private_key_file=CHANGEME

[janitor:children]
control
worker
