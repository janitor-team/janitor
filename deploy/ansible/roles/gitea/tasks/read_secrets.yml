---
# Sets gitea_secrets: every file under secrets/, by file name.
- name: List Gitea's secret files
  ansible.builtin.find:
    paths: "{{ gitea_home }}/secrets"
  register: gitea_secret_list

- name: Read Gitea's secret files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ gitea_secret_list.files | map(attribute='path') | list }}"
  register: gitea_secret_files
  no_log: true

- name: Collect Gitea's secrets
  ansible.builtin.set_fact:
    gitea_secrets: >-
      {{ dict(gitea_secret_files.results | map(attribute='item') | map('basename')
              | zip(gitea_secret_files.results | map(attribute='content') | map('b64decode') | map('trim'))) }}
  no_log: true
