    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
      text:
        titleSize: 12
        valueSize: 20
      minVizWidth: 150
      minVizHeight: 50
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
    description: 'up: running. restarted: systemd restarted it in the last hour. starting, stopping or reloading:
      systemd is changing its state, or it is in another short-lived state such as maintenance. unreachable: its
      metrics do not answer, or, for PostgreSQL and Redis, their metrics collector cannot connect to them, and for
      Postfix, its metrics collector cannot read the mail queue. stopped: not running. restarting in a loop: more
      than 2 restarts in 15 minutes or more than 3 in an hour. failed: systemd marked it failed. no data: Prometheus
      has nothing for any of them. With the node exporter, Hosts shows the state of each one in "Service, socket
      and timer states per host", and its start and stop times in "Software Janitor runs on, and its monitoring:
      last started and stopped". With the node exporter, "Host metrics collector (node exporter)" is the node exporter
      of every host and shows the worst one, and Hosts shows each host in "Host metrics". With the node exporter,
      its value comes from metrics files the hosts write: an old, missing or unreadable file, or a node exporter
      that does not answer, makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics"
      on Hosts a node exporter that does not answer). Without the node exporter there are no service states, so
      restarted, starting, stopping or reloading, stopped, restarting in a loop and failed do not show. The state
      of each entry comes from the sources this text names. A source that is off or does not answer gives none of
      its states, except that metrics that do not answer show as unreachable, as this text says. Otherwise the entry
      shows only what its other sources give, and leaves the tile when none is left. "Host metrics" on Hosts and
      the entries of this tile, such as "Health checker", show which source does not answer.'
  - title: Alerts firing
    type: stat
    targets:
      - expr: count(ALERTS{alertstate="firing"}) or vector(0)
        legend: alerts
    width: 4
    height: 4
    options:
      colorMode: background
      graphMode: none
      textMode: value
    defaults:
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: red
            value: 1
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    description: Alerts firing now. A rule fires once for each service, socket, timer, host, disk, metrics file,
      result code, or file or socket the Postfix metrics collector reads, or once for the whole system (the queue,
      the runner, the result pushes, the failed mail filter runs, Postfix's deferred mail). Grafana's Alerting page
      lists them. Alerts fire on new events and clear when they end. "Held queue items" and the 24 hour counts below
      can stay red after that.
    links:
      - title: Alerting
        url: /alerting/list
  - title: 'Fullest disk: free space, per host'
    type: stat
    targets:
      - expr: |-
          sort_by_label(min by (host)
          (last_over_time(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}[2m]) /
          last_over_time(node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}[2m])) or on (host) ((0 * max by
          (host) (up{job="node"}) - 1) unless on (host) last_over_time(node_load1[2m])), "host")
        legend: '{{host}}'
    width: 6
    height: 4
    unit: percentunit
    requires:
      - enable_node_exporter
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    defaults:
      color:
        mode: thresholds
      decimals: 0
      thresholds:
        mode: absolute
        steps:
          - color: red
            value: null
          - color: yellow
            value: 0.1
          - color: green
            value: 0.2
      mappings:
        - type: value
          options:
            '-1':
              text: no data
              color: red
              index: 0
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
    description: 'Yellow below 20% free. Red below 10% free, the same limit as the DiskAlmostFull alert. DiskFillingUp
      fires when a disk would fill up within a day at the rate of the last 6 hours. no data: the host''s node exporter
      has not answered for 2 minutes ("Host metrics" on Hosts). A host with no disk file system (only tmpfs, overlay
      and the like) has no tile.'
  - title: Service state data age
    type: stat
    targets:
      - expr: |-
          sort_by_label(time() - min by (host) ((max_over_time(node_textfile_mtime_seconds{file=~".*(units|runs)[.]prom"}[24h]) or
          (0 * max by (instance, host) ((janitor_unit_state{unit="janitor-run-metrics.timer"} or
          ((last_over_time(janitor_unit_state{unit="janitor-run-metrics.timer"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-run-metrics.timer"})[2m:10s]) >= on (host) group_left max by
          (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)))
          unless on (instance) last_over_time(node_textfile_mtime_seconds{file=~".*runs[.]prom"}[2m])) or (0 * max by (instance,
          host) (max_over_time(up{job="node"}[2m]) == 1) unless on (instance)
          last_over_time(node_textfile_mtime_seconds{file=~".*units[.]prom"}[2m]))) and on (instance) up{job="node"}), "host")
        legend: '{{host}}'
    width: 4
    height: 4
    unit: s
    requires:
      - enable_node_exporter
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
      text:
        titleSize: 11
        valueSize: 18
    defaults:
      color:
        mode: thresholds
      decimals: 0
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: red
            value: 300
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 0
        - type: range
          options:
            from: 1000000000.0
            result:
              text: a metrics file is missing
              color: red
              index: 1
    description: 'The service states file of each host (units.prom: the state, restarts, last result, start and
      stop times, memory and CPU of its units, the host''s process memory, on a worker host the crash counts and,
      on the control host with the mail filter, the failed mail filter runs) and on the control host the run counts
      file (runs.prom: the run and pipeline counts, that is the runs in progress, the items in each stage, the held
      queue items, and the runs that ended early or could not push their result branch) are only as fresh as this.
      Red after 5 minutes, when ServiceStatesMissingOrOld fires. a metrics file is missing: the service states file
      of this host, or on the control host the run counts file, is missing. ServiceStatesMissingOrOld also fires
      when the node exporter cannot read a metrics file. This tile then shows that file as missing: look in the
      node exporter''s journal on that host. A host whose node exporter does not answer keeps its last file times
      for 24 hours, so its age goes up and turns red too ("Host metrics" on Hosts shows that, and MetricsUnreachable
      fires). After 24 hours the host leaves this tile and ServiceStatesMissingOrOld stops for it. "Host metrics"
      on Hosts and MetricsUnreachable still show it. "Service state data age, per host and file" on Hosts shows
      the age of each file.'
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
  - title: Held queue items
    type: stat
    targets:
      - expr: sum(last_over_time(janitor_lost_queue_claims{campaign=~"$campaign"}[2m]))
        legend: queue items
    width: 4
    height: 4
    options:
      colorMode: background
      graphMode: none
      textMode: value
    defaults:
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: red
            value: 1
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: unknown
              color: red
              index: 0
    requires:
      - enable_node_exporter
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
    description: 'Queue items still claimed by runs that ended without a result (a worker restart or a run that
      crashed in the worker). No worker gets them. unknown: the count could not be read, because Redis, the node
      exporter on the control host or Prometheus does not answer, or the run counts file is missing or cannot be
      read ("Service state data age" shows that). QueueItemsHeld fires when the count for all campaigns grows, and
      QueueAllHeld when only held items are left for 30 minutes. Its value comes from metrics files the hosts write:
      an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong or empty ("Service
      state data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer).'
  - title: Runs crashed, 1 hour
    type: stat
    targets:
      - expr: sort_by_label(max by (host) (last_over_time(janitor_worker_job_panics_last_hour[2m])), "host")
        legend: '{{host}}'
    width: 6
    height: 4
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    defaults:
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: red
            value: 1
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    requires:
      - enable_node_exporter
    links:
      - title: 'Janitor: worker'
        url: /d/janitor-worker?${__url_time_range}&${campaign:queryparam}
    description: 'Runs that crashed in the worker (its journal shows "job panicked"). The run ends without a result,
      and its queue item then also counts in "Held queue items" while its campaign is selected. It counts all campaigns.
      The WorkerRunsCrashed alert fires on it. Its value comes from metrics files the hosts write: an old, missing
      or unreadable file, or a node exporter that does not answer, makes it wrong or empty ("Service state data
      age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer). A host whose service
      state is gone leaves the tile, for the same causes as on "Service state" on Janitor: worker, and WorkerRunsCrashed
      cannot fire for it.'
  - title: Which service is busy, idle or waiting?
    type: row
  - title: Runner
    type: stat
    targets:
      - expr: |-
          (sum(max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) or vector(0))
        ref: A
        hide: true
      - sql: SELECT count(*) AS items FROM queue
        format: table
        ref: B
        hide: true
      - expr: max(max_over_time(up{job="runner"}[2m])) or vector(0)
        ref: C
        hide: true
      - expr: |-
          (time() - max(max_over_time(job_last_success_unixtime[2m]) > 0 or
          max_over_time(janitor_unit_active_since_seconds{unit="janitor-runner.service"}[2m]))) or (vector(7200) and on ()
          count_over_time((max_over_time(job_last_success_unixtime[2m]) == 0)[2h:1m]) >= 120) or vector(0)
        ref: E
        hide: true
      - expr: sum(increase(queue_empty_total[15m])) or vector(0)
        ref: F
        hide: true
      - expr: sum(last_over_time(janitor_lost_queue_claims[2m])) or (vector(-1) and on () count(up{job="node"})
          > 0) or vector(0)
        ref: G
        hide: true
      - expr: |-
          sum(increase(assignments_total[10m])) or (vector(1) and on () (time() -
          max(max_over_time(janitor_unit_active_since_seconds{unit="janitor-runner.service"}[2m])) <= 600)) or vector(0)
        ref: H
        hide: true
      - expr: |-
          min_over_time((sum(max by (worker) (max_over_time(active_runs[2m])) or max by (worker)
          (max_over_time(janitor_runs_in_progress[2m]))) or vector(0))[2h:1m])
        ref: I
        hide: true
      - math: ($C == 0) * 4 + ($C == 1) * (($A > 0) * (($E < 7200) || ($F > 0) || ($I == 0)) * 1 + ($A > 0) * ($E
          >= 7200) * ($F == 0) * ($I > 0) * 3 + ($A == 0) * ($G >= 0) * (($B - $G) > 0) * (2 + 5 * ($H == 0)) +
          ($A == 0) * ($G < 0) * 5 + ($A == 0) * ($G > 0) * (($B - $G) <= 0) * 6)
        ref: D
    width: 4
    options:
      colorMode: background
      graphMode: none
      textMode: value
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: idle
              color: green
              index: 0
            '1':
              text: busy
              color: yellow
              index: 1
            '2':
              text: waiting
              color: yellow
              index: 2
            '3':
              text: stuck
              color: red
              index: 3
            '4':
              text: unreachable
              color: red
              index: 4
            '5':
              text: unknown
              color: red
              index: 5
            '6':
              text: only held items
              color: red
              index: 6
            '7':
              text: no worker asks for work
              color: red
              index: 7
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    description: 'busy: runs in progress. waiting: items in the queue but no run in progress (items held by ended
      runs left out). no worker asks for work: waiting, and no worker asked for work in 10 minutes. stuck: runs
      in progress for the last 2 hours, no result from a worker in the last 2 hours (after a runner start, the 2
      hours count from the start), and no worker found the queue empty in the last 15 minutes. idle: nothing to
      hand out. only held items: every queue item is held by an ended run, so no worker gets work, and QueueAllHeld
      fires after 30 minutes. unreachable: its metrics do not answer. unknown: the held items could not be read,
      because Redis or the node exporter on the control host does not answer, or the run counts file is missing
      or cannot be read ("Service state data age" shows that). no data: the queue could not be read from PostgreSQL,
      or Prometheus does not answer. Without the node exporter the held items cannot be counted, so they count as
      waiting, and "only held items" does not show. It counts all campaigns. With the node exporter, its value comes
      from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer,
      makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter
      that does not answer).'
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
  - title: Workers, per worker login
    type: stat
    targets:
      - expr: |-
          sort_by_label(max by (worker) (
            4 * (max_over_time(probe_success{job="worker"}[2m]) == bool 0)
            or 3 + 0 * (max by (worker) (last_over_time(probe_success{job="worker"}[2m])) or max by (worker)
          (last_over_time(assignments_total[2m])) unless on () count(last_over_time(probe_success{job="worker"}[2m])) > 0) unless
          on (worker) (sum by (worker) (increase(assignments_total[10m])) > 0) unless on (worker) ((max by (worker)
          (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) > 0) unless on () (time() -
          max(max_over_time(janitor_unit_active_since_seconds{unit="janitor-runner.service"}[2m])) <= 600) and on ()
          (max(max_over_time(up{job="runner"}[2m])) == 1)
            or clamp_max((max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) > 0, 1)
            or 0 * max by (worker) (last_over_time(probe_success{job="worker"}[2m]))
            or 0 * max by (worker) (last_over_time(assignments_total[2m])) unless on ()
          count(last_over_time(probe_success{job="worker"}[2m])) > 0
          ), "worker")
        legend: '{{worker}}'
    width: 8
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: idle
              color: green
              index: 0
            '1':
              text: has a run
              color: yellow
              index: 1
            '3':
              text: not asking for work
              color: red
              index: 3
            '4':
              text: unreachable
              color: red
              index: 4
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    description: 'All worker instances on one host share a worker login. It counts all campaigns. idle: it asks
      for work and has no run. has a run: the runner gave it a run that has not finished yet. not asking for work:
      no run and no request for work in 10 minutes. unreachable: the health check of at least one of its worker
      instances does not answer 200. With the node exporter, its value comes from metrics files the hosts write:
      an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong or empty ("Service
      state data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer). The
      state of each entry comes from the sources this text names. A source that is off or does not answer gives
      none of its states. The entry then shows only what its other sources give, and leaves the tile when none is
      left. "Host metrics" on Hosts, "Metrics reachable" on Janitor: runner and "Health checker" in "Software Janitor
      runs on, and its monitoring" show which source does not answer.'
    links:
      - title: 'Janitor: worker'
        url: /d/janitor-worker?${__url_time_range}&${campaign:queryparam}
  - title: 'Site: requests'
    type: stat
    targets:
      - expr: sum(last_over_time(requests_in_progress_total{route!~"ws-notifications|metrics|health"}[2m])) or vector(0)
        ref: A
        hide: true
      - expr: max(max_over_time(up{job="site"}[2m])) or vector(0)
        ref: C
        hide: true
      - math: ($C == 0) * 4 + ($C == 1) * ($A > 0)
        ref: D
    width: 4
    options:
      colorMode: background
      graphMode: none
      textMode: value
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: idle
              color: green
              index: 0
            '1':
              text: busy
              color: yellow
              index: 1
            '4':
              text: unreachable
              color: red
              index: 4
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    description: 'busy: the site is answering at least one request, not counting open live page connections, the
      metrics scrape or the health checks. idle: none. unreachable: its metrics do not answer.'
    links:
      - title: 'Janitor: site'
        url: /d/janitor-site?${__url_time_range}
  - title: Last publish pass
    type: stat
    targets:
      - expr: |-
          ((time() - max(max_over_time(last_publish_pending_success[2m]) > 0)) or (time() -
          max(max_over_time(janitor_unit_active_since_seconds{unit="janitor-publish.service"}[2m])))) and on ()
          (max_over_time(up{job="publish"}[2m]) == 1)
        legend: time since
      - expr: (max_over_time(up{job="publish"}[2m]) == 0) * 0 - 1
        legend: ' '
      - expr: |-
          vector(-2) and on () (max_over_time(up{job="publish"}[2m]) == 1) unless on ()
          (max_over_time(last_publish_pending_success[2m]) > 0) unless on () count(up{job="node"}) > 0 unless on ()
          count_over_time((max_over_time(last_publish_pending_success[2m]) == 0)[4h:1m]) >= 240
        legend: ' '
      - expr: |-
          vector(-3) and on () (max_over_time(up{job="publish"}[2m]) == 1) unless on ()
          (max_over_time(last_publish_pending_success[2m]) > 0) unless on () count(up{job="node"}) > 0 and on ()
          count_over_time((max_over_time(last_publish_pending_success[2m]) == 0)[4h:1m]) >= 240
        legend: ' '
    width: 4
    unit: s
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      reduceOptions:
        calcs:
          - lastNotNull
        fields: ''
        values: false
      wideLayout: false
    defaults:
      color:
        mode: thresholds
      mappings:
        - type: value
          options:
            '-1':
              text: unreachable
              color: red
              index: 0
            '-2':
              text: no pass yet
              color: yellow
              index: 1
            '-3':
              text: no pass yet
              color: red
              index: 2
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 3
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 9000
          - color: red
            value: 14400
    description: 'Since its last pass, or since publish started. Publish goes through the approved runs every 2
      hours by default, and publishes a run at once when it is approved. Yellow after 2.5 hours, red after 4. unreachable:
      its metrics do not answer. "No pass yet": publish has not finished its first pass, and without the node exporter
      its start time is not known. It is yellow, and red after 4 hours. With the node exporter, "4. Waiting to publish"
      shows the runs of the selected campaigns waiting for it. With the node exporter, its value comes from metrics
      files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes
      it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter
      that does not answer).'
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: Requests, 5 minutes
    type: stat
    targets:
      - expr: |-
          label_replace(sum((((last_over_time(differ_requests_total[2m]) unless last_over_time(differ_requests_total[2m] offset
          5m)) and on (job, instance) (last_over_time(up[2m] offset 5m) == 1)) or increase(differ_requests_total[5m]))) or 0 *
          (max(max_over_time(up{job="differ"}[2m])) == 1), "job", "differ", "", "")
        legend: '{{job}}'
      - expr: |-
          sum by (job) ((((last_over_time(http_requests_total{job=~"git_store|bzr_store", path!~"/metrics|/health"}[2m]) unless
          last_over_time(http_requests_total{job=~"git_store|bzr_store", path!~"/metrics|/health"}[2m] offset 5m)) and on (job,
          instance) (last_over_time(up[2m] offset 5m) == 1)) or increase(http_requests_total{job=~"git_store|bzr_store",
          path!~"/metrics|/health"}[5m]))) or 0 * (max by (job) (max_over_time(up{job=~"git_store|bzr_store"}[2m])) == 1)
        legend: '{{job}}'
    width: 4
    options:
      colorMode: none
      graphMode: none
      textMode: value_and_name
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      decimals: 0
    overrides:
      - matcher:
          id: byName
          options: differ
        properties:
          - id: displayName
            value: differ
          - id: links
            value:
              - title: Open its dashboard
                url: /d/janitor-differ?${__url_time_range}
      - matcher:
          id: byName
          options: git_store
        properties:
          - id: displayName
            value: git store
          - id: links
            value:
              - title: Open its dashboard
                url: /d/janitor-git_store?${__url_time_range}
      - matcher:
          id: byName
          options: bzr_store
        properties:
          - id: displayName
            value: bzr store
          - id: links
            value:
              - title: Open its dashboard
                url: /d/janitor-bzr_store?${__url_time_range}
    description: These do not report work in progress, so this shows only whether they had work. Not counting the
      metrics scrape and the health checks.
  - title: Where is the bottleneck?
    type: row
  - title: 1. Queue, all campaigns
    type: stat
    targets:
      - sql: SELECT count(*) AS items FROM queue
        format: table
        ref: A
        hide: true
      - expr: |-
          (sum(max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) or vector(0))
        ref: B
        hide: true
      - expr: sum(last_over_time(janitor_lost_queue_claims[2m])) or (vector(0) unless on () count(up{job="node"})
          > 0)
        ref: E
        hide: true
      - expr: sum(last_over_time(janitor_lost_queue_claims[2m]))
        ref: H
      - math: ($A - $B - $E) * (($A - $B - $E) > 0)
        ref: C
      - expr: |-
          (sum(last_over_time(janitor_pipeline_items{stage="in the queue (waiting or running)"}[2m])) -
          sum(last_over_time(janitor_pipeline_items{stage="in the queue (waiting or running)"}[2m] offset 1h))) and on ()
          sum(last_over_time(janitor_lost_queue_claims[2m]))
        legend: change, 1 hour
        ref: D
    width: 4
    options:
      colorMode: value
      graphMode: none
      textMode: value_and_name
      text:
        titleSize: 12
        valueSize: 32
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      min: 0
      noValue: unknown
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: unknown
              color: red
              index: 0
    overrides:
      - matcher:
          id: byFrameRefID
          options: C
        properties:
          - id: displayName
            value: waiting
      - matcher:
          id: byFrameRefID
          options: H
        properties:
          - id: displayName
            value: held by ended runs
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: red
                  value: 1
      - matcher:
          id: byName
          options: change, 1 hour
        properties:
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
    description: 'waiting: queue items no worker has yet, that is queue rows minus runs in progress and minus items
      held by ended runs. change, 1 hour: how many more queue items are waiting or running than an hour ago. It
      is left out until there is a reading from an hour ago. held by ended runs: queue items still claimed by runs
      that ended without a result, for all campaigns. Without the node exporter they cannot be counted, so they
      count as waiting and the held line is left out. unknown: the held items could not be read, because Redis,
      the node exporter on the control host or Prometheus does not answer, or the run counts file is missing or
      cannot be read ("Service state data age" shows that), or, without the node exporter, the queue could not be
      read from PostgreSQL. With the node exporter, a queue that could not be read shows as a missing waiting line.
      The queue has no time an item was added, so how long items waited is not known. With the node exporter, its
      value comes from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that
      does not answer, makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on
      Hosts a node exporter that does not answer).'
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
  - title: 2. Worker slots in use
    type: stat
    targets:
      - expr: |-
          clamp_max((sum(max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) or vector(0)) / count(last_over_time(probe_success{job="worker"}[2m])), 1)
        legend: in use
    width: 4
    unit: percentunit
    options:
      colorMode: background
      graphMode: none
      textMode: value
    requires:
      - enable_blackbox_exporter
    defaults:
      decimals: 0
      color:
        mode: thresholds
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 1
    description: 'Runs in progress per worker slot (runs of all campaigns). At 100% the workers are the bottleneck.
      no data: no worker slot is known (the slots are counted from the worker health checks): the health checker
      does not answer ("Health checker" in "Software Janitor runs on, and its monitoring" shows that), or Prometheus
      does not answer. With the node exporter, its value comes from metrics files the hosts write: an old, missing
      or unreadable file, or a node exporter that does not answer, makes it wrong or empty ("Service state data
      age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer).'
    links:
      - title: 'Janitor: worker'
        url: /d/janitor-worker?${__url_time_range}&${campaign:queryparam}
  - title: 3. Waiting for review
    type: stat
    targets:
      - expr: |-
          sum(last_over_time(janitor_pipeline_items{stage="waiting for review", campaign=~"$campaign"}[2m])) or (vector(0) and on
          () count(last_over_time(janitor_pipeline_items[2m])) > 0)
        legend: now
      - expr: |-
          (sum(last_over_time(janitor_pipeline_items{stage="waiting for review", campaign=~"$campaign"}[2m])) -
          sum(last_over_time(janitor_pipeline_items{stage="waiting for review", campaign=~"$campaign"}[2m] offset 1h)))
        legend: change, 1 hour
    width: 4
    options:
      colorMode: value
      graphMode: none
      textMode: value_and_name
    requires:
      - enable_node_exporter
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    overrides:
      - matcher:
          id: byName
          options: change, 1 hour
        properties:
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
    description: 'Successful runs with branches to push or propose that are not approved yet. Publish acts only
      on approved runs. Yellow while it grows. "change, 1 hour" is left out until there is a reading from an hour
      ago. Its value comes from metrics files the hosts write: an old, missing or unreadable file, or a node exporter
      that does not answer, makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics"
      on Hosts a node exporter that does not answer).'
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: 4. Waiting to publish
    type: stat
    targets:
      - expr: |-
          sum(last_over_time(janitor_pipeline_items{stage="waiting to publish", campaign=~"$campaign"}[2m])) or (vector(0) and on
          () count(last_over_time(janitor_pipeline_items[2m])) > 0)
        legend: now
      - expr: |-
          (sum(last_over_time(janitor_pipeline_items{stage="waiting to publish", campaign=~"$campaign"}[2m])) -
          sum(last_over_time(janitor_pipeline_items{stage="waiting to publish", campaign=~"$campaign"}[2m] offset 1h)))
        legend: change, 1 hour
    width: 4
    options:
      colorMode: value
      graphMode: none
      textMode: value_and_name
    requires:
      - enable_node_exporter
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    overrides:
      - matcher:
          id: byName
          options: change, 1 hour
        properties:
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
    description: 'Approved runs with a branch to push or propose, which publish has not tried yet, or has published
      only some of their branches so far. It uses the same filter as publish. Yellow while it grows. "change, 1
      hour" is left out until there is a reading from an hour ago. Its value comes from metrics files the hosts
      write: an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong or empty
      ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer).'
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: 5. Open proposals
    type: stat
    targets:
      - expr: |-
          sum(last_over_time(janitor_pipeline_items{stage="open merge proposals", campaign=~"$campaign"}[2m])) or (vector(0) and
          on () count(last_over_time(janitor_pipeline_items[2m])) > 0)
        legend: now
      - expr: |-
          (sum(last_over_time(janitor_pipeline_items{stage="open merge proposals", campaign=~"$campaign"}[2m])) -
          sum(last_over_time(janitor_pipeline_items{stage="open merge proposals", campaign=~"$campaign"}[2m] offset 1h)))
        legend: change, 1 hour
    width: 4
    options:
      colorMode: value
      graphMode: none
      textMode: value_and_name
    requires:
      - enable_node_exporter
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    overrides:
      - matcher:
          id: byName
          options: change, 1 hour
        properties:
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
    description: 'Merge proposals waiting for the codebase owners. Yellow while it grows. "change, 1 hour" is left
      out until there is a reading from an hour ago. Its value comes from metrics files the hosts write: an old,
      missing or unreadable file, or a node exporter that does not answer, makes it wrong or empty ("Service state
      data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer).'
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: 6. Merged or pushed
    type: stat
    targets:
      - sql: |-
          SELECT count(*) AS runs FROM absorbed_runs a WHERE a.delay >= interval '0' AND NOT EXISTS (SELECT FROM publish e WHERE
          e.revision = a.revision AND e.mode = 'push' AND e.result_code = 'success' AND e.timestamp < a.absorbed_at) AND NOT
          EXISTS (SELECT FROM merge_proposal m WHERE m.revision = a.revision AND m.merged_at < a.absorbed_at) AND absorbed_at >
          (now() AT TIME ZONE 'UTC') - interval '24 hours' AND campaign IN (${campaign:singlequote})
        format: table
    width: 4
    options:
      colorMode: none
      graphMode: none
      textMode: value_and_name
      wideLayout: false
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      displayName: 24 hours
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
    description: Runs whose change was first merged or pushed in the last 24 hours. A later push of the same run
      does not count again. "Merge proposals and pushes, by campaign" counts every push.
  - title: 1. Queue clears in
    type: stat
    targets:
      - sql: |-
          SELECT extract(epoch FROM coalesce(sum(estimated_duration), interval '0')) AS seconds FROM queue WHERE campaign IN
          (${campaign:singlequote})
        format: table
        ref: A
        hide: true
      - expr: count(last_over_time(probe_success{job="worker"}[2m]))
        ref: B
        hide: true
      - expr: |-
          sum(last_over_time(janitor_lost_queue_claims_estimated_seconds{campaign=~"$campaign"}[2m])) or (vector(0) unless on ()
          count(up{job="node"}) > 0)
        ref: H
        hide: true
      - math: ($A - $H) * (($A - $H) > 0) / $B
        ref: C
    width: 4
    unit: s
    options:
      colorMode: none
      graphMode: none
      textMode: value_and_name
      wideLayout: false
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      noValue: unknown
      displayName: estimate
    requires:
      - enable_blackbox_exporter
    description: 'The queue''s estimated run times added up (running items too, items held by ended runs left out,
      but without the node exporter they cannot be counted and are in the sum), divided by the worker slots. It
      follows the Campaign selector. The worker slots are those of all workers. unknown: the queue could not be
      read from PostgreSQL, no worker slot is known (the slots are counted from the worker health checks, so this
      needs the health checker: "Health checker" in "Software Janitor runs on, and its monitoring" shows when it
      does not answer), or the held items could not be read, because Redis, the node exporter on the control host
      or Prometheus does not answer, or the run counts file is missing or cannot be read ("Service state data age"
      shows that). With the node exporter, its value comes from metrics files the hosts write: an old, missing or
      unreadable file, or a node exporter that does not answer, makes it wrong or empty ("Service state data age"
      shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer).'
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
  - title: 2. Run time
    type: stat
    targets:
      - sql: |-
          SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM duration)) AS seconds FROM run WHERE finish_time >
          (now() AT TIME ZONE 'UTC') - interval '24 hours' AND start_time > (now() AT TIME ZONE 'UTC') - interval '24 hours' -
          interval '1 day' AND campaign IN (${campaign:singlequote})
        format: table
    width: 4
    unit: s
    options:
      colorMode: none
      graphMode: none
      textMode: value_and_name
      wideLayout: false
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      noValue: none
      displayName: median, 24 hours
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
    description: Of the runs that finished in the last 24 hours.
  - title: 3. Oldest for review
    type: stat
    targets:
      - sql: |-
          SELECT coalesce(extract(epoch FROM (now() AT TIME ZONE 'UTC') - min(finish_time)), -1) AS age FROM publish_ready pr
          WHERE campaign IN (${campaign:singlequote}) AND publish_status IN ('unknown', 'needs-manual-review') AND change_set_state
          IN ('ready', 'publishing') AND EXISTS (SELECT FROM unnest(unpublished_branches) b WHERE b.mode IN ('propose',
          'attempt-push', 'push-derived', 'push')) AND NOT EXISTS (SELECT FROM publish p WHERE p.revision = pr.revision AND
          p.result_code = 'success')
        format: table
    width: 4
    unit: s
    options:
      colorMode: background
      graphMode: none
      textMode: value
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
    defaults:
      color:
        mode: thresholds
      mappings:
        - type: value
          options:
            '-1':
              text: none
              color: green
              index: 0
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 86400
          - color: red
            value: 604800
    description: Yellow after a day, red after a week.
  - title: 4. Oldest to publish
    type: stat
    targets:
      - sql: |-
          SELECT coalesce(extract(epoch FROM (now() AT TIME ZONE 'UTC') - min(finish_time)), -1) AS age FROM publish_ready pr
          WHERE campaign IN (${campaign:singlequote}) AND publish_status = 'approved' AND change_set_state IN ('ready', 'publishing')
          AND EXISTS (SELECT FROM unnest(unpublished_branches) b WHERE b.mode IN ('propose', 'attempt-push', 'push-derived',
          'push')) AND NOT EXISTS (SELECT FROM publish p WHERE p.revision = pr.revision AND p.result_code = 'success') AND (SELECT
          l.code FROM new_result_branch b CROSS JOIN LATERAL (SELECT p.result_code AS code, p.timestamp FROM publish p WHERE
          p.revision = b.revision AND p.run_id = b.run_id ORDER BY p.timestamp DESC LIMIT 1) l WHERE b.run_id = pr.id AND l.code
          <> 'success' ORDER BY l.code IN ('success', 'nothing-to-do', 'empty-merge-proposal', 'merge-conflict',
          'diverged-branches'), l.code ~
          ('^(too-many-requests|differ-unreachable|branch-busy|network-error|service-unavailable|bad-gateway|' ||
          'differ-http-error|project-creation-timeout|.*-temporarily-unavailable|.*-rate-limited)$'), l.timestamp DESC LIMIT 1) IS
          NULL
        format: table
    width: 4
    unit: s
    options:
      colorMode: background
      graphMode: none
      textMode: value
    defaults:
      color:
        mode: thresholds
      mappings:
        - type: value
          options:
            '-1':
              text: none
              color: green
              index: 0
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 86400
          - color: red
            value: 604800
    description: 'Of the runs waiting to publish: not tried yet, or only some of their branches published so far.
      Yellow after a day, red after a week. Publish rate limits can hold runs back on purpose.'
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: 5. New proposals
    type: stat
    targets:
      - sql: |-
          SELECT count(*) AS proposals FROM (SELECT p.merge_proposal_url, min(p.timestamp) AS opened FROM publish p JOIN
          change_set cs ON cs.id = p.change_set WHERE p.mode = 'propose' AND p.result_code = 'success' AND p.merge_proposal_url IS
          NOT NULL AND cs.campaign IN (${campaign:singlequote}) GROUP BY 1) mp WHERE opened > (now() AT TIME ZONE 'UTC') -
          interval '24 hours'
        format: table
    width: 4
    options:
      colorMode: none
      graphMode: none
      textMode: value_and_name
      wideLayout: false
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      displayName: 24 hours
    description: Counted from the first successful propose of each merge proposal.
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: 6. Merge or push time
    type: stat
    targets:
      - sql: |-
          SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM delay)) AS seconds FROM absorbed_runs a WHERE
          a.delay >= interval '0' AND NOT EXISTS (SELECT FROM publish e WHERE e.revision = a.revision AND e.mode = 'push' AND
          e.result_code = 'success' AND e.timestamp < a.absorbed_at) AND NOT EXISTS (SELECT FROM merge_proposal m WHERE m.revision
          = a.revision AND m.merged_at < a.absorbed_at) AND absorbed_at > (now() AT TIME ZONE 'UTC') - interval '7 days' AND
          campaign IN (${campaign:singlequote})
        format: table
    width: 4
    unit: s
    options:
      colorMode: none
      graphMode: none
      textMode: value_and_name
      wideLayout: false
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      noValue: none
      displayName: median, 7 days
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
    description: The median time from the end of the run to its first merge or push, over the last 7 days.
  - title: Busiest host, CPU
    type: stat
    targets:
      - expr: |-
          sort_by_label(topk(1, (1 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) and on (host) max by (host)
          (last_over_time(node_load1[2m]))), "host")
        legend: '{{host}}'
    width: 8
    unit: percentunit
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    requires:
      - enable_node_exporter
    defaults:
      decimals: 0
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 0.8
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 0
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
    description: The host with the highest CPU use over the last 5 minutes. "Where is the load?" has the rest.
  - title: 4. Runs that failed to publish
    type: stat
    targets:
      - expr: |-
          sum(last_over_time(janitor_pipeline_items{stage="failed to publish, to fix", campaign=~"$campaign"}[2m])) or (vector(0)
          and on () count(last_over_time(janitor_pipeline_items[2m])) > 0)
        legend: to fix
      - expr: |-
          sum(last_over_time(janitor_pipeline_items{stage="failed to publish, will retry", campaign=~"$campaign"}[2m])) or
          (vector(0) and on () count(last_over_time(janitor_pipeline_items[2m])) > 0)
        legend: will retry
    width: 8
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    requires:
      - enable_node_exporter
    defaults:
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: red
            value: 1
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    overrides:
      - matcher:
          id: byName
          options: will retry
        properties:
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
    description: 'Approved runs that publish has not fully published, where the last publish attempt on one of their
      branches failed. A result of nothing to do or an empty merge proposal does not count. Merge conflicts and
      diverged branches do not count either, because publish then schedules a new run by itself. Publish tries the
      runs in both states below again after a wait. to fix: on at least one branch, the last error most often needs
      someone, for example a forge login. will retry: on every failed branch, the last error most often clears by
      itself (a rate limit, a busy branch, a network error). "Latest publish attempts" below (the newest 20) or
      on Janitor: publish (the newest 30) shows why, while the attempt is among them. Its value comes from metrics
      files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes
      it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter
      that does not answer).'
  - title: 4. Median time to publish, 24 hours
    type: stat
    targets:
      - sql: |-
          SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM p.timestamp - r.finish_time)) AS seconds FROM
          publish p JOIN run r ON r.id = p.run_id WHERE p.result_code = 'success' AND p.timestamp > (now() AT TIME ZONE 'UTC') -
          interval '24 hours' AND r.campaign IN (${campaign:singlequote}) AND NOT EXISTS (SELECT FROM new_result_branch b JOIN
          publish e ON e.revision = b.revision WHERE b.run_id = p.run_id AND e.run_id = p.run_id AND e.result_code = 'success' AND
          e.timestamp < p.timestamp)
        format: table
    width: 8
    unit: s
    options:
      colorMode: none
      graphMode: none
      textMode: value
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      noValue: none
    description: The median time from the end of the run to its first publish. Only runs first published in the
      last 24 hours. A later publish of the same run does not count. Runs that wait a long time show in "3. Oldest
      for review" and "4. Oldest to publish".
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: Items in each stage
    type: timeseries
    width: 24
    height: 8
    requires:
      - enable_node_exporter
    description: 'The stage whose line keeps growing is the bottleneck. The stages are: in the queue (waiting or
      running), waiting for review, waiting to publish, "failed to publish, to fix", "failed to publish, will retry",
      and open merge proposals. They are counted every minute from PostgreSQL, and the held items from Redis. Runs
      in progress come from the runner. Dashed lines use the right axis. Its lines come from metrics files the hosts
      write: an old, missing or unreadable file, or a node exporter that does not answer, makes them wrong or leaves
      gaps ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not
      answer).'
    targets:
      - expr: sum by (stage) (janitor_pipeline_items{campaign=~"$campaign"})
        legend: '{{stage}}'
      - expr: sum(last_over_time(janitor_lost_queue_claims{campaign=~"$campaign"}[2m]))
        legend: queue items held by ended runs
      - expr: (sum(max by (worker) (active_runs) or max by (worker) (janitor_runs_in_progress)) or vector(0))
        legend: runs in progress (all campaigns)
    overrides:
      - matcher:
          id: byRegexp
          options: in the queue.*|queue items held.*|open merge proposals
        properties:
          - id: custom.axisPlacement
            value: right
          - id: custom.axisLabel
            value: queue and open proposals
          - id: custom.lineStyle
            value:
              fill: dash
              dash:
                - 10
                - 10
      - matcher:
          id: byName
          options: in the queue (waiting or running)
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: blue
      - matcher:
          id: byName
          options: queue items held by ended runs
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: dark-red
      - matcher:
          id: byName
          options: runs in progress (all campaigns)
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: dark-blue
      - matcher:
          id: byName
          options: waiting for review
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: purple
      - matcher:
          id: byName
          options: waiting to publish
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: light-purple
      - matcher:
          id: byName
          options: failed to publish, to fix
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: red
      - matcher:
          id: byName
          options: failed to publish, will retry
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: yellow
      - matcher:
          id: byName
          options: open merge proposals
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: light-blue
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
  - title: Which alerts are firing or pending, which services failed?
    type: row
  - title: Which alerts are firing or pending
    type: table
    width: 12
    height: 8
    description: 'One line per firing or pending alert, firing first. pending: the condition holds, but not yet
      for as long as the rule waits. metrics source: the Prometheus job the alert reads its metrics from. systemd
      state: for service alerts, the state systemd reports. Grafana''s Alerting page shows its summary.'
    links:
      - title: Alerting
        url: /alerting/list
    targets:
      - expr: ALERTS
        format: table
        instant: true
    transformations:
      - id: organize
        options:
          excludeByName:
            Time: true
            Value: true
            __name__: true
            instance: true
          indexByName:
            alertstate: 0
            alertname: 1
          renameByName:
            alertstate: alert state
            job: metrics source
            state: systemd state
      - id: sortBy
        options:
          sort:
            - field: alert state
    overrides:
      - matcher:
          id: byName
          options: alert state
        properties:
          - id: custom.cellOptions
            value:
              type: color-text
          - id: mappings
            value:
              - type: value
                options:
                  firing:
                    color: red
