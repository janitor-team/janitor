  - title: Where is the load?
    type: row
  - title: 'Janitor services: requests, errors, CPU, memory and restarts'
    type: table
    width: 24
    height: 13
    description: 'One line per service. Click a service for its own dashboard. Errors are server errors (5xx). For
      the site they also count exceptions. For the differ they count the diffs that failed on its side, not its
      answers about a missing, failed or badly named run, a run whose artifacts are missing, or a format it cannot
      give. CPU is in cores. Memory leaves out file cache. Restarts are those systemd made by itself. Workers are
      one line per host. A rebuild of the sbuild chroot runs inside the first worker instance, so its load shows
      in the worker''s CPU and memory ("sbuild chroot rebuild" on Janitor: worker shows when one runs). not measured:
      the service exports no such metric (archive, auto-upload, the dependency server, the worker), or its metrics
      have not answered for 2 minutes ("Janitor services" then says unreachable). no data: the service states of
      that host are missing ("Service state data age" shows a missing or old file, "Host metrics" on Hosts a node
      exporter that does not answer). For memory, also when the service is stopped or failed (systemd has no reading
      for it then). CPU then falls to 0.00 within 5 minutes (it is the mean of the last 5 minutes), or shows no
      data if the service has not run since the host started. For CPU and the restart count, also when the service
      appeared less than a minute ago (they need two readings). For last started, also when the service has not
      been up since the host started. A service keeps its line for at least an hour after its service state goes
      missing. Without the node exporter there are no service states: only the services with request metrics have
      a line, and CPU, memory, restarts and last started stay empty. The mail filter has no line: it starts once
      for each mail and then stops. Requests do not count the metrics scrape and the health checks. Errors count
      a failing health check for the runner and publish only. For the site, requests also leave out the live page
      connections and the requests that ended in an exception, which the errors count. For the runner, only requests
      to its internal API count, not the workers'' API. With the node exporter, its value comes from metrics files
      the hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong
      or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does
      not answer).'
    targets:
      - expr: |-
