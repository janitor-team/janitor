  - title: Resource use per host
    type: table
    width: 24
    height: 6
    requires:
      - enable_node_exporter
    targets:
      - expr: |-
          sort_by_label((1 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) and on (host) max by (host)
          (last_over_time(node_load1[2m])), "host")
        format: table
        instant: true
      - expr: |-
          sort_by_label(max by (host) (last_over_time(node_load1[2m])) / on (host) count by (host)
          (last_over_time(node_cpu_seconds_total{mode="idle"}[2m])), "host")
        format: table
        instant: true
      - expr: |-
          sort_by_label(max by (host) (1 - last_over_time(node_memory_MemAvailable_bytes[2m]) /
          last_over_time(node_memory_MemTotal_bytes[2m])), "host")
        format: table
        instant: true
      - expr: |-
          sort_by_label(max by (host) (1 -
          last_over_time(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}[2m]) /
          last_over_time(node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}[2m])), "host")
        format: table
        instant: true
      - expr: |-
          sort_by_label(max by (host)
          (rate(node_disk_io_time_seconds_total{device=~"(sd|vd|xvd|hd)[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+"}[5m])) and on (host)
          max by (host) (last_over_time(node_load1[2m])), "host")
        format: table
        instant: true
      - expr: |-
          sort_by_label(sum by (host) (rate(node_network_receive_bytes_total{device=~"(en|eth|ib|wl|ww)[a-zA-OQ-Z0-9]+"}[5m])) and
          on (host) max by (host) (last_over_time(node_load1[2m])), "host")
        format: table
        instant: true
      - expr: |-
          sort_by_label(sum by (host) (rate(node_network_transmit_bytes_total{device=~"(en|eth|ib|wl|ww)[a-zA-OQ-Z0-9]+"}[5m]))
          and on (host) max by (host) (last_over_time(node_load1[2m])), "host")
        format: table
        instant: true
      - expr: sort_by_label(max by (host) (up{job="node"}), "host")
        format: table
        instant: true
    transformations:
      - id: merge
        options: {}
      - id: organize
        options:
          excludeByName:
            Time: true
            'Value #H': true
          renameByName:
            'Value #A': CPU busy
            'Value #B': load per core, 1 minute
            'Value #C': memory used
            'Value #D': fullest disk, used
            'Value #E': busiest disk, time busy
            'Value #F': network in
            'Value #G': network out
    overrides:
      - matcher:
          id: byRegexp
          options: CPU busy|memory used|fullest disk|busiest disk, time busy
        properties:
          - id: unit
            value: percentunit
          - id: decimals
            value: 0
      - matcher:
