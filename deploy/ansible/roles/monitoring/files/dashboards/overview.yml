                    color: yellow
                    index: 1
    defaults:
      noValue: none
  - title: Failed services
    type: table
    width: 12
    height: 8
    requires:
      - enable_node_exporter
    description: 'Every systemd unit (service, socket or timer) in the service states that failed, on any host.
      none failed: no unit failed, or there are no service states ("Service state data age" shows a missing or old
      file, "Host metrics" on Hosts a node exporter that does not answer). Its value comes from metrics files the
      hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong or
      empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does not
      answer). A failed unit whose service state is gone leaves the list: the node exporter of its host has not
      answered for 2 minutes ("Host metrics" on Hosts), or its service states file is missing or cannot be read.
      A failed mail filter run is not listed: systemd drops it at once, and "Failed mail filter runs, 1 hour" on
      Janitor: mail filter counts those of the last hour from the journal.'
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
    targets:
      - expr: |-
          (janitor_unit_state{state="failed"} or ((last_over_time(janitor_unit_state{state="failed"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="failed"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1
        format: table
        instant: true
      - expr: |-
          1000 * last_over_time(janitor_unit_inactive_since_seconds[2m]) and on (host, unit) ((janitor_unit_state{state="failed"}
          or ((last_over_time(janitor_unit_state{state="failed"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="failed"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
        format: table
        instant: true
    transformations:
      - id: merge
        options: {}
      - id: organize
        options:
          excludeByName:
            Time: true
            'Value #A': true
            job: true
            instance: true
            __name__: true
            state: true
          renameByName:
            'Value #B': failed since
    overrides:
      - matcher:
          id: byName
          options: failed since
        properties:
          - id: unit
            value: dateTimeFromNow
    defaults:
      noValue: none failed
      custom:
        cellOptions:
          type: color-text
      color:
        mode: fixed
        fixedColor: red
  - title: What is happening now?
    type: row
  - title: Runs in progress
    type: stat
    targets:
      - expr: |-
          (sum(max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
