          SELECT result_code AS result, count(*) AS runs FROM run WHERE finish_time > (now() AT TIME ZONE 'UTC') - interval
          '1 hour' AND start_time > (now() AT TIME ZONE 'UTC') - interval '1 hour' - interval '1 day' AND campaign IN
