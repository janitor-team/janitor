    description: 'As the runner counts them. It counts all campaigns. With the node exporter, its value comes from
      metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer,
      makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter
