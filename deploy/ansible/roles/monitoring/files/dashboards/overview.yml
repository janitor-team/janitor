    description: 'From the runner, per worker login (a worker login is shared by all worker instances on one host).
      Which codebase and campaign each run is for is only in Redis, which Grafana cannot read. A worker login with
      no run in progress is listed at 0 from the worker health checks (the health checker), or, while the health
      checker gives none, from the logins that have asked the runner for work since it last started. It counts all
      campaigns. With the node exporter, its value comes from metrics files the hosts write: an old, missing or
      unreadable file, or a node exporter that does not answer, makes it wrong or empty ("Service state data age"
      shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer).'
    targets:
      - expr: |-
          sort_by_label((max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) or 0 * max by (worker) (last_over_time(probe_success{job="worker"}[2m])) or 0 * max by (worker)
          (last_over_time(assignments_total[2m])) unless on () count(last_over_time(probe_success{job="worker"}[2m])) > 0,
