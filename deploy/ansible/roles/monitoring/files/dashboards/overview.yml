---
# Rendered by templates/dashboard.json.j2.
title: 'Janitor: overview'
uid: janitor-overview
description: 'Every Janitor service on one page: what is up, which service is busy, where work piles up, which alerts
  fire, what is happening, where the load is, and the numbers for each campaign.'
tags:
  - janitor
  - core
  - control
  - worker
variables:
  - name: campaign
    label: Campaign
    type: query
    datasource:
      type: grafana-postgresql-datasource
      uid: postgres
    query: |-
      SELECT campaign AS name FROM candidate UNION SELECT campaign FROM queue UNION SELECT campaign FROM change_set UNION SELECT
      campaign FROM run WHERE start_time > (now() AT TIME ZONE 'UTC') - interval '30 days' UNION SELECT '(no campaign yet)' WHERE
      NOT EXISTS (SELECT FROM candidate) AND NOT EXISTS (SELECT FROM queue) AND NOT EXISTS (SELECT FROM run) AND NOT EXISTS
      (SELECT FROM change_set) ORDER BY 1
    definition: SELECT campaign AS name FROM candidate UNION SELECT campaign FROM queue UNION SELECT campaign FROM change_set
      UNION SELECT campaign FROM run WHERE start_time > (now() AT TIME ZONE 'UTC') - interval '30 days' UNION SELECT
      '(no campaign yet)' WHERE NOT EXISTS (SELECT FROM candidate) AND NOT EXISTS (SELECT FROM queue) AND NOT EXISTS
      (SELECT FROM run) AND NOT EXISTS (SELECT FROM change_set) ORDER BY 1
    multi: true
    includeAll: true
    refresh: 1
    sort: 1
    current:
      selected: true
      text:
        - All
      value:
        - $__all
panels:
  - title: Is every service up?
    type: row
  - title: Janitor services
    type: stat
    targets:
      - expr: |-
          sort_by_label(label_replace(label_replace(max by (service) (
            label_replace(6 * ((janitor_unit_state{state="failed", unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"} or ((last_over_time(janitor_unit_state{state="failed",
          unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service", unit!~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="failed", unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1),
          "service", "$1", "unit", "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
            or label_replace(5 * ((round(increase(janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"}[15m])) > 2 or
          round(increase(janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"}[1h])) > 3) > bool 0) and on (host, unit)
          (janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service", unit!~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)), "service",
          "$1", "unit", "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
            or label_replace(4 * ((janitor_unit_state{state="inactive", unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"} or ((last_over_time(janitor_unit_state{state="inactive",
          unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service", unit!~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="inactive", unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1),
          "service", "$1", "unit", "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
            or label_replace(2 * ((janitor_unit_state{state!~"active|inactive|failed",
          unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service", unit!~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state!~"active|inactive|failed", unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state!~"active|inactive|failed",
          unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service", unit!~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1), "service", "$1", "unit", "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
            or label_replace((increase(janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"}[1h]) > bool 0) and on (host, unit)
          (janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service", unit!~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_restarts_total{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)), "service",
          "$1", "unit", "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
            or label_replace(0 * ((janitor_unit_state{state="active", unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"} or ((last_over_time(janitor_unit_state{state="active",
          unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service", unit!~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="active", unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service",
          unit!~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1),
          "service", "$1", "unit", "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
            or label_replace(3 * (max_over_time(up{job=~"git_store|bzr_store|differ|archive|runner|publish|site|auto_upload"}[2m])
          == bool 0), "service", "$1", "job", "(.+)")
            or label_replace(0 * up{job=~"git_store|bzr_store|differ|archive|runner|publish|site|auto_upload"}, "service", "$1",
          "job", "(.+)")
            or 3 * (max_over_time(probe_success{job="health"}[2m]) == bool 0)
            or label_replace(3 * (max_over_time(probe_success{job="ognibuild_dep"}[2m]) == bool 0), "service", "ognibuild_dep",
          "job", ".*")
            or label_replace(6 * ((janitor_unit_state{unit="janitor-mail-filter.socket", state="failed"} or
          ((last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket", state="failed"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-mail-filter.socket", state="failed"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1), "service", "mail_filter", "unit", ".*")
            or label_replace(4 * ((janitor_unit_state{unit="janitor-mail-filter.socket", state="inactive"} or
          ((last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket", state="inactive"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-mail-filter.socket", state="inactive"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1), "service", "mail_filter", "unit", ".*")
            or label_replace(2 * ((janitor_unit_state{unit="janitor-mail-filter.socket", state!~"active|inactive|failed"} or
          ((last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket", state!~"active|inactive|failed"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-mail-filter.socket",
          state!~"active|inactive|failed"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1),
          "service", "mail_filter", "unit", ".*")
            or label_replace(0 * ((janitor_unit_state{unit="janitor-mail-filter.socket", state="active"} or
          ((last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket", state="active"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-mail-filter.socket", state="active"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1), "service", "mail_filter", "unit", ".*")
            or label_replace(6 * ((last_over_time(janitor_mail_filter_failed_runs_last_hour[2m]) > bool 0) == 1), "service",
          "mail_filter", "", "")
            or label_replace(5.5 *
          ((min_over_time((sum(last_over_time(postfix_showq_message_size_bytes_count{queue="deferred"}[2m])) or vector(0))[1h:1m])
          > 0) > bool 0) and on () (count(last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket"}[2m])) > 0),
          "service", "mail_filter", "", "")
            or label_replace(1.5 * ((sum(last_over_time(postfix_showq_message_size_bytes_count{queue="deferred"}[2m])) > 0) > bool
          0) and on () (count(last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket"}[2m])) > 0), "service",
          "mail_filter", "", "")
            or label_replace(3 * (group(last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket"}[24h])) unless on ()
          group(last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket"}[2m]))), "service", "mail_filter", "", "")
          ), "order", "$1", "service", "(.*)"), "order", "dependency_server", "service", "ognibuild_dep"), "order")
        legend: '{{service}}'
    width: 24
    height: 4
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: up
              color: green
              index: 0
            '1':
              text: restarted
              color: yellow
              index: 1
            '1.5':
              text: mail held back
              color: yellow
              index: 2
            '2':
              text: starting, stopping or reloading
              color: yellow
              index: 3
            '3':
              text: unreachable
              color: red
              index: 4
            '4':
              text: stopped
              color: red
              index: 5
            '5':
              text: restarting in a loop
              color: red
              index: 6
            '5.5':
              text: mail held back for an hour
              color: red
              index: 7
            '6':
              text: failed
              color: red
              index: 8
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 1
          - color: red
            value: 3
      links:
        - title: Open its dashboard
          url: /d/janitor-${__field.labels.service}?${__url_time_range}&${campaign:queryparam}
    overrides:
      - matcher:
          id: byName
          options: archive
        properties:
          - id: displayName
            value: archive
      - matcher:
          id: byName
          options: auto_upload
        properties:
          - id: displayName
            value: auto-upload
      - matcher:
          id: byName
          options: bzr_store
        properties:
          - id: displayName
            value: bzr store
      - matcher:
          id: byName
          options: ognibuild_dep
        properties:
          - id: displayName
            value: dependency server
      - matcher:
          id: byName
          options: differ
        properties:
          - id: displayName
            value: differ
      - matcher:
          id: byName
          options: git_store
        properties:
          - id: displayName
            value: git store
      - matcher:
          id: byName
          options: mail_filter
        properties:
          - id: displayName
            value: mail filter
      - matcher:
          id: byName
          options: publish
        properties:
          - id: displayName
            value: publish
      - matcher:
          id: byName
          options: runner
        properties:
          - id: displayName
            value: runner
      - matcher:
          id: byName
          options: site
        properties:
          - id: displayName
            value: site
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    description: 'up: running. restarted: systemd restarted it in the last hour. starting, stopping or reloading:
      systemd is changing its state, or it is in another short-lived state such as maintenance. unreachable: its
      metrics do not answer, its health check does not answer 200 (the runner, publish and the differ answer 503
      when they cannot reach PostgreSQL, publish also when it cannot reach Redis, the runner also when it cannot
      reach its log store), or, for the mail filter, the service state of its socket (janitor-mail-filter.socket)
      was there in the last 24 hours and is gone now. stopped: not running. restarting in a loop: more than 2 restarts
      in 15 minutes or more than 3 in an hour. failed: systemd marked it failed. no data: Prometheus has nothing
      for any of them. mail held back: Postfix has deferred mail, most often because the mail filter fails. mail
      held back for an hour: Postfix has had deferred mail for the whole last hour, and MailHeldBack fires. Both
      come from the Postfix metrics collector. Click a service for its dashboard. With the node exporter, its value
      comes from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does
      not answer, makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts
      a node exporter that does not answer). Without the node exporter there are no service states, so restarted,
      starting, stopping or reloading, stopped, restarting in a loop and failed do not show. The mail filter then
      has no tile. The state of each entry comes from the sources this text names. A source that is off or does
      not answer gives none of its states, except that a service whose own metrics do not answer shows as unreachable,
      as this text says. Otherwise the entry shows only what its other sources give, and leaves the tile when none
      is left. The mail filter is different. A mail filter run that failed in the last hour shows it as failed ("Failed
      mail filter runs, 1 hour" on Janitor: mail filter counts them from the journal). Its Postfix states need the
      service state of its socket, so they do not show while that state is gone, also while the Postfix metrics
      collector answers. When that state was there in the last 24 hours and is gone now, the mail filter shows as
      unreachable. After 24 hours it leaves the tile, since a mail filter run needs its socket. "Host metrics" on
      Hosts and the entries of "Software Janitor runs on, and its monitoring", such as "Health checker", show which
      source does not answer.'
  - title: Workers, per host
    type: stat
    targets:
      - expr: |-
          sort_by_label(max by (host) (
            6 * ((janitor_unit_state{state="failed", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state="failed", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="failed", unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 5 * ((round(increase(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[15m])) > 2 or
          round(increase(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[1h])) > 3) > bool 0) and on
          (host, unit) (janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1))
            or 4 * ((janitor_unit_state{state="inactive", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state="inactive", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="inactive", unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >=
          on (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 2 * ((janitor_unit_state{state!~"active|inactive|failed", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state!~"active|inactive|failed", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m])
          and (max_over_time(timestamp(janitor_unit_state{state!~"active|inactive|failed",
          unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
            or ((increase(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[1h]) > bool 0) and on (host,
          unit) (janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))
            or 0 * ((janitor_unit_state{state="active", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state="active", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="active", unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 3 * (max_over_time(probe_success{job="worker"}[2m]) == bool 0)
            or 0 * last_over_time(probe_success{job="worker"}[2m])
          ), "host")
        legend: '{{host}}'
    width: 8
    height: 6
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: up
              color: green
              index: 0
            '1':
              text: restarted
              color: yellow
              index: 1
            '1.5':
              text: mail held back
              color: yellow
              index: 2
            '2':
              text: starting, stopping or reloading
              color: yellow
              index: 3
            '3':
              text: unreachable
              color: red
              index: 4
            '4':
              text: stopped
              color: red
              index: 5
            '5':
              text: restarting in a loop
              color: red
              index: 6
            '5.5':
              text: mail held back for an hour
              color: red
              index: 7
            '6':
              text: failed
              color: red
              index: 8
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 1
          - color: red
            value: 3
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    description: 'up: running. restarted: systemd restarted it in the last hour. starting, stopping or reloading:
      systemd is changing its state, or it is in another short-lived state such as maintenance. unreachable: the
      health check of at least one of its worker instances does not answer 200. stopped: not running. restarting
      in a loop: more than 2 restarts in 15 minutes or more than 3 in an hour. failed: systemd marked it failed.
      no data: Prometheus has nothing for any of them. With the node exporter, its value comes from metrics files
      the hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong
      or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter that does
      not answer). Without the node exporter there are no service states, so restarted, starting, stopping or reloading,
      stopped, restarting in a loop and failed do not show. The state of each entry comes from the sources this
      text names. A source that is off or does not answer gives none of its states. The entry then shows only what
      its other sources give, and leaves the tile when none is left. "Host metrics" on Hosts and the entries of
      "Software Janitor runs on, and its monitoring", such as "Health checker", show which source does not answer.'
    links:
      - title: 'Janitor: worker'
        url: /d/janitor-worker?${__url_time_range}&${campaign:queryparam}
  - title: Software Janitor runs on, and its monitoring
    type: stat
    targets:
      - expr: |-
          sort_by_label(label_replace(max by (service) (
            label_replace(6 * ((janitor_unit_state{state="failed",
          unit=~"(caddy|redis-server|postgresql|postfix|gitea|garage|jaeger|prometheus|grafana)(@.+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state="failed",
          unit=~"(caddy|redis-server|postgresql|postfix|gitea|garage|jaeger|prometheus|grafana)(@.+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="failed",
          unit=~"(caddy|redis-server|postgresql|postfix|gitea|garage|jaeger|prometheus|grafana)(@.+)?[.]service"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1), "service", "$1", "unit",
