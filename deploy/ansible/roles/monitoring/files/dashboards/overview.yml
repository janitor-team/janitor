    description: 'Yellow: busy, memory nearly full or a disk over 80% used. Red: a disk over 90% used. Busiest disk
      counts whole disks only, and network counts network cards and modems only, as in "Disk time busy per host
      and disk" and "Network traffic per host" on Hosts. no data: the host''s node exporter has not answered for
      2 minutes ("Host metrics" on Hosts), or, for CPU busy, it answered again less than 30 seconds ago after 5
      minutes or more without an answer (a 5 minute rate needs two readings). For fullest disk, also when the host
      has no disk file system (only tmpfs, overlay and the like). not measured: for busiest disk, the host has no
      whole disk, and for network, it has no network card or modem that is counted (as in "Network traffic per host"
      on Hosts). Busiest disk and network also show it when the node exporter has not answered for 2 minutes, or
      answered again less than 30 seconds ago after 5 minutes or more without an answer. A host whose node exporter
      is gone keeps its row.'
  - title: CPU per service and host, in cores, top 10 at each moment
    type: timeseries
    width: 12
    height: 8
    requires:
      - enable_node_exporter
    description: 'Over 10 minutes. Per host, "other processes" is the CPU time that no service in the service states
      accounts for, the kernel included. Services below the top 10 are in neither line. Its lines come from metrics
      files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes
      them wrong or leaves gaps ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node
      exporter that does not answer). An old service states file sets a host''s services to 0, so they leave the
      top 10 and "other processes" takes their CPU. A rebuild of the sbuild chroot runs inside the first worker
      instance, so its load shows on janitor-worker.service of that worker host ("sbuild chroot rebuild" on Janitor:
      worker shows whether one runs now).'
    overrides:
      - matcher:
          id: byRegexp
          options: .+ janitor-(runner|publish|site|archive|differ|git_store|bzr_store|auto_upload|ognibuild_dep|worker(-[0-9]+)?)[.]service
        properties:
          - id: links
            value:
              - title: Open its dashboard
                url: /d/janitor-${__field.labels.service}?${__url_time_range}&${campaign:queryparam}
    targets:
      - expr: |-
          label_replace(topk(10, rate(janitor_unit_cpu_seconds_total{unit=~".+[.]service"}[10m])), "service", "$1", "unit",
          "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
        legend: '{{host}} {{unit}}'
      - expr: |-
          clamp_min(sum by (host) (rate(node_cpu_seconds_total{mode!~"idle|iowait"}[10m])) - on (host) sum by (host)
          (rate(janitor_unit_cpu_seconds_total{unit=~".+[.]service"}[10m])), 0)
        legend: '{{host}} other processes'
    options:
      legend:
        displayMode: table
        placement: right
        calcs:
          - mean
          - max
        sortBy: Max
        sortDesc: true
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
  - title: Memory per service and host, top 10 at each moment
    type: timeseries
    unit: bytes
    width: 12
    height: 8
    requires:
      - enable_node_exporter
    description: 'Without file cache. Per host, "other processes" is the process memory no service in the service
      states accounts for, read at the same moment as the services. "Kernel and reserved cache" is used memory that
      is neither process memory nor cache the kernel counts as free. Services below the top 10 are in none of these
      lines. Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter
      that does not answer, makes them wrong or leaves gaps ("Service state data age" shows the files'' age, "Host
      metrics" on Hosts a node exporter that does not answer). A rebuild of the sbuild chroot runs inside the first
      worker instance, so its load shows on janitor-worker.service of that worker host ("sbuild chroot rebuild"
      on Janitor: worker shows whether one runs now).'
    overrides:
      - matcher:
          id: byRegexp
          options: .+ janitor-(runner|publish|site|archive|differ|git_store|bzr_store|auto_upload|ognibuild_dep|worker(-[0-9]+)?)[.]service
        properties:
          - id: links
            value:
              - title: Open its dashboard
                url: /d/janitor-${__field.labels.service}?${__url_time_range}&${campaign:queryparam}
    targets:
      - expr: |-
          label_replace(topk(10, janitor_unit_memory_in_use_bytes{unit=~".+[.]service"}), "service", "$1", "unit",
          "janitor-([a-z_]+?)(-[0-9]+)?[.]service")
        legend: '{{host}} {{unit}}'
      - expr: |-
          clamp_min(max by (host) (janitor_host_memory_in_use_bytes) - on (host) sum by (host)
          (janitor_unit_memory_in_use_bytes{unit=~".+[.]service"}), 0)
        legend: '{{host}} other processes'
      - expr: |-
          max by (host) (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes - node_memory_AnonPages_bytes -
          node_memory_Shmem_bytes)
        legend: '{{host}} kernel and reserved cache'
    options:
      legend:
        displayMode: table
        placement: right
        calcs:
          - mean
          - max
        sortBy: Max
        sortDesc: true
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
  - title: Services per host
    type: table
    width: 24
    height: 23
    requires:
      - enable_node_exporter
    targets:
      - expr: |-
          sort_by_label(label_replace(label_replace(count by (host, service)
          (label_replace((janitor_unit_state{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit=~"janitor-[a-z_]+(-[0-9]+)?[.]service"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1, "service", "$1", "unit", "janitor-([a-z_]+?)(-[0-9]+)?[.]service") or
          label_replace((janitor_unit_state{unit=~"(caddy|redis-server|postgresql|postfix|gitea|garage|jaeger|prometheus|grafana)(@.+)?[.]service"}
          or
          ((last_over_time(janitor_unit_state{unit=~"(caddy|redis-server|postgresql|postfix|gitea|garage|jaeger|prometheus|grafana)(@.+)?[.]service"}[2m])
          and
          (max_over_time(timestamp(janitor_unit_state{unit=~"(caddy|redis-server|postgresql|postfix|gitea|garage|jaeger|prometheus|grafana)(@.+)?[.]service"})[2m:10s])
          >= on (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on
          (host) up{job="node"} == 1)) == 1, "service", "$1", "unit",
          "(caddy|redis-server|postgresql|postfix|gitea|garage|jaeger|prometheus|grafana)(@.+)?[.]service") or
          label_replace((janitor_unit_state{unit="janitor-mail-filter.socket"} or
          ((last_over_time(janitor_unit_state{unit="janitor-mail-filter.socket"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-mail-filter.socket"})[2m:10s]) >= on (host) group_left max by
          (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1,
          "service", "mail_filter", "unit", ".*")), "order", "$1", "service", "(.*)"), "order", "dependency_server", "service",
          "ognibuild_dep"), "host")
        format: table
        instant: true
    overrides:
      - matcher:
          id: byRegexp
          options: ^service.*
        properties:
          - id: mappings
            value:
              - type: value
                options:
                  archive:
                    text: archive
                    index: 0
                  auto_upload:
                    text: auto-upload
                    index: 1
                  bzr_store:
                    text: bzr store
                    index: 2
                  ognibuild_dep:
                    text: dependency server
                    index: 3
                  differ:
                    text: differ
                    index: 4
                  git_store:
                    text: git store
                    index: 5
                  mail_filter:
                    text: mail filter
                    index: 6
                  publish:
                    text: publish
                    index: 7
                  runner:
                    text: runner
                    index: 8
                  site:
                    text: site
                    index: 9
                  caddy:
                    text: Caddy
                    index: 10
                  garage:
                    text: Garage
                    index: 11
                  gitea:
                    text: Gitea
                    index: 12
                  grafana:
                    text: Grafana
                    index: 13
                  jaeger:
                    text: Jaeger
                    index: 14
                  postfix:
                    text: Postfix
                    index: 15
                  postgresql:
                    text: PostgreSQL
                    index: 16
                  prometheus:
                    text: Prometheus
                    index: 17
                  redis-server:
                    text: Redis
                    index: 18
                  worker:
                    text: worker
                    index: 19
    transformations:
      - id: groupingToMatrix
        options:
          columnField: host
          rowField: service
          valueField: Value
          emptyValue: 'null'
    defaults:
      noValue: ''
      mappings:
        - type: range
          options:
            from: 1
            to: 1000
            result:
              text: is here
              index: 0
    description: 'Which services run on which host, in any state. A service leaves the table when its unit was removed.
      A whole host leaves it (its column, and every service only it runs) when its node exporter has not answered
      for 2 minutes ("Host metrics" on Hosts), or its service states file is missing or cannot be read. Its value
      comes from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does
      not answer, makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts
      a node exporter that does not answer).'
    links:
      - title: Hosts
        url: /d/janitor-host?${__url_time_range}
  - title: How is each campaign doing?
    type: row
  - title: Runs finished per hour, by campaign and result
    type: timeseries
    width: 24
    height: 9
    targets:
      - sql: |-
          SELECT $__timeGroupAlias(finish_time, '1h', 0), campaign || ': ' || CASE WHEN failure_stage ~ 'result-(push|sym)' AND
          result_code <> 'push-failed' THEN result_code || ' (result push)' ELSE result_code END AS metric, count(*) AS value FROM
          run WHERE $__timeFilter(finish_time) AND start_time > $__timeFrom()::timestamp - interval '1 day' AND campaign IN
          (${campaign:singlequote}) GROUP BY 1, 2 ORDER BY 1
    options:
      legend:
        displayMode: table
        placement: right
        calcs:
          - sum
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
    description: 'From the run table. "(result push)" after a result: the run could not push its result branch,
      before or after the build. Each hour is drawn at its start, so the hour in progress shows at once. "Results
      the runner stored per hour, by campaign and result" on Janitor: runner shows at each moment the count of the
      hour before it, so there the same run is drawn up to an hour further to the right.'
    defaults:
      color:
        mode: shades
        fixedColor: blue
      custom:
        stacking:
          mode: normal
          group: A
        fillOpacity: 40
    overrides:
      - matcher:
          id: byRegexp
          options: '.*: (worker-failure|worker-timeout|worker-disappeared|system-failure|push-failed|publish-error|.+
            [(]result push[)])$'
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: red
      - matcher:
          id: byRegexp
          options: '.*: success$'
        properties:
          - id: color
            value:
              mode: fixed
              fixedColor: green
  - title: Queue items, by campaign
    type: bargauge
    width: 8
    height: 11
    requires:
      - enable_node_exporter
    description: 'Waiting or running, and held by ended runs (red from 1), counted every minute. unknown: the counts
      could not be read, because Redis, the node exporter on the control host or Prometheus does not answer, or
      the run counts file is missing or cannot be read ("Service state data age" shows that). Its value comes from
      metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer,
      makes it wrong or empty ("Service state data age" shows the files'' age, "Host metrics" on Hosts a node exporter
      that does not answer).'
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      decimals: 0
      links:
        - title: 'Janitor: runner for this campaign'
          url: /d/janitor-runner?${__url_time_range}&var-campaign=${__field.labels.campaign}
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: unknown
              color: red
              index: 0
      min: 0
      displayName: ${__series.name}
      noValue: unknown
    targets:
      - expr: |-
          sum by (campaign) (last_over_time(janitor_pipeline_items{stage="in the queue (waiting or running)",
          campaign=~"$campaign"}[2m]))
        legend: '{{campaign}}: waiting or running'
      - expr: sum by (campaign) (last_over_time(janitor_lost_queue_claims{campaign=~"$campaign"}[2m]))
        legend: '{{campaign}}: held by ended runs'
    overrides:
      - matcher:
          id: byRegexp
          options: .*held by ended runs
        properties:
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: blue
                  value: null
                - color: red
                  value: 1
    options:
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      namePlacement: top
      text:
        titleSize: 14
      reduceOptions:
        values: true
        calcs: []
        fields: ''
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
  - title: Share of runs with result success, last 24 hours
    type: bargauge
    unit: percentunit
    width: 8
    height: 11
    targets:
      - sql: |-
          SELECT campaign, avg((result_code = 'success')::int) AS succeeded FROM run WHERE finish_time > (now() AT TIME
          ZONE 'UTC') - interval '24 hours' AND start_time > (now() AT TIME ZONE 'UTC') - interval '24 hours' - interval '1 day'
          AND campaign IN (${campaign:singlequote}) GROUP BY 1 ORDER BY 1
        format: table
    options:
      orientation: horizontal
      displayMode: basic
      showUnfilled: true
      namePlacement: left
      text:
        titleSize: 14
      reduceOptions:
        values: true
        calcs: []
        fields: ''
      valueMode: text
    defaults:
      color:
        mode: fixed
        fixedColor: blue
      min: 0
      max: 1
      decimals: 0
      displayName: ${__data.fields.campaign}
      links:
        - title: 'Janitor: runner for this campaign'
          url: /d/janitor-runner?${__url_time_range}&var-campaign=${__data.fields.campaign}
      noValue: no runs finished in the last 24 hours
    description: Many campaigns end most runs with a result other than success (for example nothing to do), so a
      low share is normal.
    links:
      - title: 'Janitor: runner'
        url: /d/janitor-runner?${__url_time_range}&${campaign:queryparam}
  - title: Merge proposals and pushes, by campaign
    type: table
    width: 8
    height: 11
    defaults:
      custom:
        wrapHeaderText: true
        width: 100
    targets:
      - sql: |-
          SELECT cs.campaign, count(DISTINCT p.merge_proposal_url) FILTER (WHERE mp.status = 'open') AS "open proposals",
          count(DISTINCT p.merge_proposal_url) FILTER (WHERE mp.status IN ('merged', 'applied')) AS "merged, all time", count(*)
          FILTER (WHERE p.mode = 'push' AND p.result_code = 'success' AND p.timestamp > (now() AT TIME ZONE 'UTC') - interval
          '24 hours') AS "pushes, last 24 hours" FROM publish p JOIN change_set cs ON cs.id = p.change_set LEFT JOIN
          merge_proposal mp ON mp.url = p.merge_proposal_url WHERE cs.campaign IN (${campaign:singlequote}) GROUP BY 1 ORDER BY 1
        format: table
    overrides:
      - matcher:
          id: byName
          options: campaign
        properties:
          - id: links
            value:
              - title: 'Janitor: publish for this campaign'
                url: /d/janitor-publish?${__url_time_range}&var-campaign=${__data.fields.campaign}
    links:
      - title: 'Janitor: publish'
        url: /d/janitor-publish?${__url_time_range}&${campaign:queryparam}
    description: Open merge proposals now, merged ones of all time, and pushes in the last 24 hours.
