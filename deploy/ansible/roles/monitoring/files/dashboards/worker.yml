---
# Rendered by templates/dashboard.json.j2.
title: 'Janitor: worker'
uid: janitor-worker
description: The workers that build the runs. They export no metrics of their own, so this comes from the runner,
  the health checks, the service states, the worker's journal and the run table. A rebuild of the sbuild chroot
  runs inside the first worker instance, so the rebuild's load shows on janitor-worker.service.
tags:
  - janitor
  - core
  - building
  - worker
variables:
  - name: campaign
    label: Campaign
    type: query
    datasource:
      type: grafana-postgresql-datasource
      uid: postgres
    query: |-
      SELECT campaign AS name FROM candidate UNION SELECT campaign FROM queue UNION SELECT campaign FROM change_set UNION SELECT
      campaign FROM run WHERE start_time > (now() AT TIME ZONE 'UTC') - interval '30 days' UNION SELECT '(no campaign yet)' WHERE
      NOT EXISTS (SELECT FROM candidate) AND NOT EXISTS (SELECT FROM queue) AND NOT EXISTS (SELECT FROM run) AND NOT EXISTS
      (SELECT FROM change_set) ORDER BY 1
    definition: SELECT campaign AS name FROM candidate UNION SELECT campaign FROM queue UNION SELECT campaign FROM change_set
      UNION SELECT campaign FROM run WHERE start_time > (now() AT TIME ZONE 'UTC') - interval '30 days' UNION SELECT
      '(no campaign yet)' WHERE NOT EXISTS (SELECT FROM candidate) AND NOT EXISTS (SELECT FROM queue) AND NOT EXISTS
      (SELECT FROM run) AND NOT EXISTS (SELECT FROM change_set) ORDER BY 1
    multi: true
    includeAll: true
    refresh: 1
    sort: 1
    current:
      selected: true
      text:
        - All
      value:
        - $__all
panels:
  - title: Health
    type: row
  - title: Health check passes, per host
    type: stat
    targets:
      - expr: sort_by_label(min by (host) (max_over_time(probe_success{job="worker"}[2m])), "host")
        legend: '{{host}}'
    width: 5
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: 'no'
              color: red
              index: 0
            '1':
              text: 'yes'
              color: green
              index: 1
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 2
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    requires:
      - enable_blackbox_exporter
    description: 'no: the health check of at least one of its worker instances does not answer 200. no data: the
      health checker (blackbox exporter) does not answer, or Prometheus does not answer.'
  - title: Workers (all campaigns)
    type: stat
    targets:
      - expr: |-
          sort_by_label(max by (worker) (
            4 * (max_over_time(probe_success{job="worker"}[2m]) == bool 0)
            or 3 + 0 * (max by (worker) (last_over_time(probe_success{job="worker"}[2m])) or max by (worker)
          (last_over_time(assignments_total[2m])) unless on () count(last_over_time(probe_success{job="worker"}[2m])) > 0) unless
          on (worker) (sum by (worker) (increase(assignments_total[10m])) > 0) unless on (worker) ((max by (worker)
          (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) > 0) unless on () (time() -
          max(max_over_time(janitor_unit_active_since_seconds{unit="janitor-runner.service"}[2m])) <= 600) and on ()
          (max(max_over_time(up{job="runner"}[2m])) == 1)
            or clamp_max((max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) > 0, 1)
            or 0 * max by (worker) (last_over_time(probe_success{job="worker"}[2m]))
            or 0 * max by (worker) (last_over_time(assignments_total[2m])) unless on ()
          count(last_over_time(probe_success{job="worker"}[2m])) > 0
          ), "worker")
        legend: '{{worker}}'
    description: 'All worker instances on one host share a worker login. idle: it asks for work and has no run.
      has a run: the runner gave it a run that has not finished yet. not asking for work: no run and no request
      for work in 10 minutes. unreachable: the health check of at least one of its worker instances does not answer
      200. With the node exporter, its value comes from metrics files the hosts write: an old, missing or unreadable
      file, or a node exporter that does not answer, makes it wrong or empty ("Service state data age" on Janitor:
      overview shows the files'' age, "Host metrics" on Hosts a node exporter that does not answer). The state of
      each entry comes from the sources this text names. A source that is off or does not answer gives none of its
      states. The entry then shows only what its other sources give, and leaves the tile when none is left. "Host
      metrics" on Hosts, "Metrics reachable" on Janitor: runner and "Health checker" in "Software Janitor runs on,
      and its monitoring" on Janitor: overview show which source does not answer.'
    width: 5
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: idle
              color: green
              index: 0
            '1':
              text: has a run
              color: yellow
              index: 1
            '3':
              text: not asking for work
              color: red
              index: 3
            '4':
              text: unreachable
              color: red
              index: 4
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
  - title: sbuild chroot rebuild
    type: stat
    targets:
      - expr: |-
          sort_by_label(max by (host) (
            7 * (max by (host) (ALERTS{alertname="ChrootRebuildStuck", alertstate="firing"}) == 1)
            or 6 * ((janitor_unit_state{unit="janitor-sbuild-chroot.service", state="failed"} or
          ((last_over_time(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="failed"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="failed"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 6 * ((janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"} or
          ((last_over_time(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1) and on (host) ((janitor_unit_result{unit="janitor-sbuild-chroot.service", result!="success"}
          or ((last_over_time(janitor_unit_result{unit="janitor-sbuild-chroot.service", result!="success"}[2m]) and
          (max_over_time(timestamp(janitor_unit_result{unit="janitor-sbuild-chroot.service", result!="success"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 1 * ((janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"} or
          ((last_over_time(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 4 * ((janitor_unit_state{unit="janitor-sbuild-chroot.timer", state!="active"} or
          ((last_over_time(janitor_unit_state{unit="janitor-sbuild-chroot.timer", state!="active"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-sbuild-chroot.timer", state!="active"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 0 * (janitor_unit_state{unit="janitor-sbuild-chroot.service"} or
          ((last_over_time(janitor_unit_state{unit="janitor-sbuild-chroot.service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{unit="janitor-sbuild-chroot.service"})[2m:10s]) >= on (host) group_left max
          by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1))
          ), "host")
        legend: '{{host}}'
    width: 5
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    requires:
      - enable_node_exporter
    description: 'not rebuilding: the timer waits for its next run. rebuilding: a rebuild runs. timer stopped: no
      rebuild will start. failed (retries in an hour): the last rebuild failed, and the next try waits. not done
      after 2 hours: ChrootRebuildStuck fires. A host whose service state is gone leaves the tile, for the same
      causes as on "Service state", and ChrootRebuildStuck cannot fire for it. Its value comes from metrics files
      the hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong
      or empty ("Service state data age" on Janitor: overview shows the files'' age, "Host metrics" on Hosts a node
      exporter that does not answer).'
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: not rebuilding
              color: green
              index: 0
            '1':
              text: rebuilding
              color: yellow
              index: 1
            '4':
              text: timer stopped
              color: red
              index: 4
            '6':
              text: failed (retries in an hour)
              color: red
              index: 6
            '7':
              text: not done after 2 hours
              color: red
              index: 7
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
  - title: Worker slots in use
    type: stat
    targets:
      - expr: |-
          sort_by_label(((max by (worker) (last_over_time(active_runs[2m])) or max by (worker) ((janitor_runs_in_progress or
          ((last_over_time(janitor_runs_in_progress[2m]) and (max_over_time(timestamp(janitor_runs_in_progress)[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))) or 0 * count by (worker) (last_over_time(probe_success{job="worker"}[2m]))) / count by (worker)
          (last_over_time(probe_success{job="worker"}[2m])), "worker")
        legend: '{{worker}}'
    width: 4
    unit: percentunit
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    requires:
      - enable_blackbox_exporter
    defaults:
      decimals: 0
      color:
        mode: thresholds
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 1
    description: 'Runs in progress per worker slot (each worker instance is one slot). At 100% this login has no
      free slot. It counts all campaigns. no data: no worker slot is known (the slots are counted from the worker
      health checks): the health checker does not answer ("Health checker" in "Software Janitor runs on, and its
      monitoring" on Janitor: overview shows that), or Prometheus does not answer. With the node exporter, its value
      comes from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does
      not answer, makes it wrong or empty ("Service state data age" on Janitor: overview shows the files'' age,
      "Host metrics" on Hosts a node exporter that does not answer).'
  - title: Runs crashed, 1 hour
    type: stat
    targets:
      - expr: sort_by_label(max by (host) (last_over_time(janitor_worker_job_panics_last_hour[2m])), "host")
        legend: '{{host}}'
    width: 5
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    defaults:
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: red
            value: 1
      mappings:
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
    requires:
      - enable_node_exporter
    description: 'Runs that crashed in the worker (its journal shows "job panicked"). The run ends without a result,
      and its queue item then also counts in "Held queue items" on Janitor: runner while its campaign is selected.
      It counts all campaigns. The WorkerRunsCrashed alert fires on it. Its value comes from metrics files the hosts
      write: an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong or empty
      ("Service state data age" on Janitor: overview shows the files'' age, "Host metrics" on Hosts a node exporter
      that does not answer). A host whose service state is gone leaves the tile, for the same causes as on "Service
      state", and WorkerRunsCrashed cannot fire for it.'
  - title: Service state
    type: stat
    targets:
      - expr: |-
          sort_by_label(max by (unit, host) (
            6 * ((janitor_unit_state{state="failed", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state="failed", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="failed", unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 5 * ((round(increase(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[15m])) > 2 or
          round(increase(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[1h])) > 3) > bool 0) and on
          (host, unit) (janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1))
            or 4 * ((janitor_unit_state{state="inactive", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state="inactive", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="inactive", unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >=
          on (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
            or 2 * ((janitor_unit_state{state!~"active|inactive|failed", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state!~"active|inactive|failed", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m])
          and (max_over_time(timestamp(janitor_unit_state{state!~"active|inactive|failed",
          unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host) group_left max by (host)
          (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
            or ((increase(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[1h]) > bool 0) and on (host,
          unit) (janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)))
            or 0 * ((janitor_unit_state{state="active", unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_state{state="active", unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_state{state="active", unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on
          (host) group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1)) == 1)
          ), "host", "unit")
        legend: '{{unit}} on {{host}}'
    width: 8
    height: 6
    newline: true
    requires:
      - enable_node_exporter
    defaults:
      mappings:
        - type: value
          options:
            '0':
              text: up
              color: green
              index: 0
            '1':
              text: restarted
              color: yellow
              index: 1
            '1.5':
              text: mail held back
              color: yellow
              index: 2
            '2':
              text: starting, stopping or reloading
              color: yellow
              index: 3
            '3':
              text: unreachable
              color: red
              index: 4
            '4':
              text: stopped
              color: red
              index: 5
            '5':
              text: restarting in a loop
              color: red
              index: 6
            '5.5':
              text: mail held back for an hour
              color: red
              index: 7
            '6':
              text: failed
              color: red
              index: 8
        - type: special
          options:
            match: 'null'
            result:
              text: no data
              color: red
              index: 99
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
          - color: green
            value: null
          - color: yellow
            value: 1
          - color: red
            value: 3
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      justifyMode: center
    description: 'up: running. restarted: systemd restarted it in the last hour. starting, stopping or reloading:
      systemd is changing its state, or it is in another short-lived state such as maintenance. stopped: not running.
      restarting in a loop: more than 2 restarts in 15 minutes or more than 3 in an hour. failed: systemd marked
      it failed. A unit whose service state is gone leaves the tile: the unit was removed, the node exporter of
      its host has not answered for 2 minutes ("Host metrics" on Hosts), or the service states file of its host
      is missing or cannot be read. no data means none of its units has a service state. Its value comes from metrics
      files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes
      it wrong or empty ("Service state data age" on Janitor: overview shows the files'' age, "Host metrics" on
      Hosts a node exporter that does not answer).'
  - title: Last started and stopped
    type: table
    width: 16
    height: 6
    requires:
      - enable_node_exporter
    targets:
      - expr: 1000 * last_over_time(janitor_unit_active_since_seconds{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m])
        format: table
        instant: true
      - expr: 1000 * last_over_time(janitor_unit_inactive_since_seconds{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m])
        format: table
        instant: true
      - expr: |-
          round(increase(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[24h])) and on (host, unit)
          last_over_time(janitor_unit_restarts_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m])
        format: table
        instant: true
      - expr: |-
          (janitor_unit_result{unit=~"janitor-worker(-[0-9]+)?[.]service"} or
          ((last_over_time(janitor_unit_result{unit=~"janitor-worker(-[0-9]+)?[.]service"}[2m]) and
          (max_over_time(timestamp(janitor_unit_result{unit=~"janitor-worker(-[0-9]+)?[.]service"})[2m:10s]) >= on (host)
          group_left max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host)
          up{job="node"} == 1))
        format: table
        instant: true
    transformations:
      - id: merge
        options: {}
      - id: organize
        options:
          excludeByName:
            Time: true
            job: true
            instance: true
            __name__: true
            'Value #D': true
          renameByName:
            'Value #A': last started
            'Value #B': last stopped
            'Value #C': restarts by systemd, 24 hours
            result: last result
      - id: sortBy
        options:
          sort:
            - field: restarts by systemd, 24 hours
              desc: true
    overrides:
      - matcher:
          id: byRegexp
          options: last (started|stopped)
        properties:
          - id: unit
            value: dateTimeFromNow
      - matcher:
          id: byRegexp
          options: restarts by systemd, 24 hours
        properties:
          - id: custom.cellOptions
            value:
              type: color-background
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: yellow
                  value: 1
                - color: red
                  value: 5
          - id: custom.wrapHeaderText
            value: true
      - matcher:
          id: byName
          options: restarts by systemd, 24 hours
        properties:
          - id: mappings
            value:
              - type: special
                options:
                  match: 'null'
                  result:
                    text: no data
                    color: transparent
                    index: 9
      - matcher:
          id: byName
          options: host
        properties:
          - id: custom.width
            value: 90
      - matcher:
          id: byName
          options: last started
        properties:
          - id: custom.width
            value: 110
      - matcher:
          id: byName
          options: last stopped
        properties:
          - id: custom.width
            value: 110
      - matcher:
          id: byName
          options: restarts by systemd, 24 hours
        properties:
          - id: custom.width
            value: 120
      - matcher:
          id: byName
          options: last result
        properties:
          - id: custom.width
            value: 100
      - matcher:
          id: byName
          options: last result
        properties:
          - id: custom.cellOptions
            value:
              type: color-text
          - id: mappings
            value:
              - type: value
                options:
                  success:
                    color: text
                    index: 0
              - type: regex
                options:
                  pattern: .+
                  result:
                    color: red
                    index: 1
    description: 'last result: systemd sets it back to success when it starts the unit again. A crash that systemd
      restarted shows in the restart count, and in last stopped until the next manual restart. The cause is in the
      unit''s journal. no data: the unit appeared less than a minute ago (the count needs two readings). Its value
      comes from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does
      not answer, makes it wrong or empty ("Service state data age" on Janitor: overview shows the files'' age,
      "Host metrics" on Hosts a node exporter that does not answer). A unit whose service state is gone leaves the
      table, for the same causes as on "Service state".'
  - title: Memory
    type: timeseries
    unit: bytes
    requires:
      - enable_node_exporter
    description: 'A rebuild of the sbuild chroot runs inside the first worker instance, so its load shows on janitor-worker.service
      ("sbuild chroot rebuild" shows whether one runs now). Memory in use, without file cache. Its lines come from
      metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer,
      makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the files'' age, "Host
      metrics" on Hosts a node exporter that does not answer).'
    targets:
      - expr: janitor_unit_memory_in_use_bytes{unit=~"janitor-worker(-[0-9]+)?[.]service"}
        legend: '{{unit}} on {{host}}'
  - title: CPU, in cores
    type: timeseries
    unit: short
    requires:
      - enable_node_exporter
    defaults:
      custom:
        axisSoftMax: 0.01
    targets:
      - expr: rate(janitor_unit_cpu_seconds_total{unit=~"janitor-worker(-[0-9]+)?[.]service"}[5m])
        legend: '{{unit}} on {{host}}'
    description: 'A rebuild of the sbuild chroot runs inside the first worker instance, so its load shows on janitor-worker.service
      ("sbuild chroot rebuild" shows whether one runs now). Its lines come from metrics files the hosts write: an
      old, missing or unreadable file, or a node exporter that does not answer, makes them wrong or leaves gaps
      ("Service state data age" on Janitor: overview shows the files'' age, "Host metrics" on Hosts a node exporter
      that does not answer).'
  - title: Health check time
    type: timeseries
    unit: s
    width: 24
    requires:
      - enable_blackbox_exporter
    description: The slowest worker instance on each host.
    targets:
      - expr: max by (host) (probe_duration_seconds{job="worker"})
        legend: '{{host}}'
  - title: Runs
    type: row
  - title: Runs in progress per worker login (all campaigns)
    type: timeseries
    targets:
      - expr: |-
          (max by (worker) (active_runs) or max by (worker) (janitor_runs_in_progress)) or 0 * max by (worker)
          (probe_success{job="worker"}) or 0 * max by (worker) (assignments_total) unless on () count(probe_success{job="worker"})
          > 0
        legend: '{{worker}}'
    description: 'A worker login is shared by all worker instances on one host. With the node exporter, its lines
      come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does
      not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the files''
      age, "Host metrics" on Hosts a node exporter that does not answer). A worker login with no run in progress
      is drawn at 0 from the worker health checks (the health checker), or, while the health checker gives none,
      from the logins that have asked the runner for work since it last started.'
    defaults:
      color:
        mode: shades
        fixedColor: blue
  - title: Runs that crashed in the worker, per host, over time (all campaigns)
    type: timeseries
    requires:
      - enable_node_exporter
    description: 'The count over the hour before, written every 30 seconds, so a crash shows for an hour. Its lines
      come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does
      not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the files''
      age, "Host metrics" on Hosts a node exporter that does not answer).'
    targets:
      - expr: max by (host) (janitor_worker_job_panics_last_hour)
        legend: '{{host}}'
    defaults:
      decimals: 0
      color:
        mode: shades
        fixedColor: red
  - title: Runs finished per hour, per worker login
    type: timeseries
    width: 24
    targets:
      - sql: |-
          SELECT $__timeGroupAlias(finish_time, '1h', 0), worker AS metric, count(*) AS value FROM run WHERE
          $__timeFilter(finish_time) AND start_time > $__timeFrom()::timestamp - interval '1 day' AND campaign IN
          (${campaign:singlequote}) GROUP BY 1, 2 ORDER BY 1
    description: Each hour is drawn at its start, so the hour in progress shows at once.
  - title: Results per worker login, last 24 hours
    type: table
    width: 24
    targets:
      - sql: |-
          SELECT worker, count(*) AS runs, count(*) FILTER (WHERE result_code = 'success') AS succeeded, count(*) FILTER (WHERE
          result_code = 'worker-timeout') AS "runs that took too long", count(*) FILTER (WHERE result_code IN ('worker-failure',
          'worker-disappeared')) AS "runs ended early, worker lost", count(*) FILTER (WHERE failure_stage ~ 'result-(push|sym)')
          AS "push failed", percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM duration)) AS "median run time" FROM
          run WHERE finish_time > (now() AT TIME ZONE 'UTC') - interval '24 hours' AND start_time > (now() AT TIME ZONE 'UTC') -
          interval '24 hours' - interval '1 day' AND campaign IN (${campaign:singlequote}) GROUP BY 1 ORDER BY 1
        format: table
    overrides:
      - matcher:
          id: byName
          options: median run time
        properties:
          - id: unit
            value: s
      - matcher:
          id: byRegexp
          options: runs that took too long
        properties:
          - id: custom.cellOptions
            value:
              type: color-background
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: red
                  value: 1
          - id: custom.wrapHeaderText
            value: true
      - matcher:
          id: byRegexp
          options: runs ended early, worker lost
        properties:
          - id: custom.cellOptions
            value:
              type: color-background
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: red
                  value: 1
          - id: custom.wrapHeaderText
            value: true
      - matcher:
          id: byRegexp
          options: push failed
        properties:
          - id: custom.cellOptions
            value:
              type: color-background
          - id: color
            value:
              mode: thresholds
          - id: thresholds
            value:
              mode: absolute
              steps:
                - color: green
                  value: null
                - color: red
                  value: 1
          - id: custom.wrapHeaderText
            value: true
    description: 'runs that took too long: the runner ended them at their time limit. runs ended early, worker lost:
      the runner ended them because the worker failed its health check or went away. Runs that crashed in the worker
      leave no run row, so they are in no column. With the node exporter, "Runs crashed, 1 hour" counts those of
      the last hour, of all campaigns, and "Runs that crashed in the worker, per host, over time (all campaigns)"
      above shows them over time. push failed: the worker could not push the result branch to the stores, before
      or after the build, or the branch had the wrong VCS type.'
