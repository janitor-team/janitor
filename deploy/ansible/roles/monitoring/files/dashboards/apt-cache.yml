---
# Rendered by templates/dashboard.json.j2.
title: apt-cacher-ng
uid: janitor-apt-cache
tags: [janitor, optional, building, control, apt-cacher-ng]
description: apt-cacher-ng, which the sbuild chroots and their builds download through.
panels:
  - title: Health check passes
    type: stat
    description: >-
      no: its report page does not answer 200. no data: the health checker (blackbox exporter) does not answer, or
      Prometheus does not answer.
    height: 8
    unit: short
    width: 4
    requires: [enable_blackbox_exporter]
    defaults:
      mappings:
        - type: value
          options:
            "0": {text: "no", color: red, index: 0}
            "1": {text: "yes", color: green, index: 1}
        - type: special
          options: {match: "null", result: {text: no data, color: red, index: 9}}
    options:
      colorMode: background
      graphMode: none
    targets:
      - expr: max_over_time(probe_success{job="apt_cacher_ng"}[2m])
        legend: health check
  - title: Health check time
    type: timeseries
    unit: s
    width: 20
    requires: [enable_blackbox_exporter]
    targets:
      - expr: probe_duration_seconds{job="apt_cacher_ng"}
        legend: health check
  - title: "Share of files served from the cache, over the last hour"
    type: timeseries
    description: >-
      Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that
      does not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the
      files' age, "Host metrics" on Hosts a node exporter that does not answer).
    defaults: {noValue: "no files asked for in this time range, or the counts could not be read", min: 0, max: 1}
    unit: percentunit
    requires: [enable_node_exporter]
    targets:
      - expr: >-
          clamp(1 - increase(apt_cacher_ng_fetches_total[1h])
          / (increase(apt_cacher_ng_requests_total[1h]) > 0), 0, 1)
        legend: served from the cache
  - title: Bytes sent to clients and fetched from the mirror
    type: timeseries
    description: >-
      Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that
      does not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the
      files' age, "Host metrics" on Hosts a node exporter that does not answer).
    unit: Bps
    requires: [enable_node_exporter]
    targets:
      - expr: rate(apt_cacher_ng_sent_bytes_total[5m])
        legend: sent to clients
      - expr: rate(apt_cacher_ng_fetched_bytes_total[5m])
        legend: fetched from the mirror
  - title: Bytes sent per client
    type: timeseries
    description: >-
      Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that
      does not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the
      files' age, "Host metrics" on Hosts a node exporter that does not answer).
    unit: Bps
    requires: [enable_node_exporter]
    targets:
      - expr: >-
          sum by (client) ((((apt_cacher_ng_client_sent_bytes_total unless apt_cacher_ng_client_sent_bytes_total offset 5m)
          and on (job, instance) (up offset 5m == 1)) or increase(apt_cacher_ng_client_sent_bytes_total[5m])) / 300)
        legend: "{{client}}"
  - title: Files sent per client per minute
    type: timeseries
    description: >-
      Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that
      does not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the
      files' age, "Host metrics" on Hosts a node exporter that does not answer).
    unit: short
    requires: [enable_node_exporter]
    targets:
      - expr: |-
          sum by (client) ((((apt_cacher_ng_client_requests_total unless apt_cacher_ng_client_requests_total offset 5m) and on (job, instance) (up offset 5m ==
          1)) or increase(apt_cacher_ng_client_requests_total[5m])) / 300) * 60
        legend: "{{client}}"
  - title: Files sent to clients and fetched from the mirror per minute
    type: timeseries
    description: >-
      Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that
      does not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the
      files' age, "Host metrics" on Hosts a node exporter that does not answer).
    unit: short
    requires: [enable_node_exporter]
    targets:
      - expr: rate(apt_cacher_ng_requests_total[5m]) * 60
        legend: sent to clients
      - expr: rate(apt_cacher_ng_fetches_total[5m]) * 60
        legend: fetched from the mirror
  - title: Cache size
    type: timeseries
    description: >-
      Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that
      does not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor: overview shows the
      files' age, "Host metrics" on Hosts a node exporter that does not answer).
    unit: bytes
    requires: [enable_node_exporter]
    targets:
      - expr: apt_cacher_ng_cache_bytes
        legend: cache
  - title: apt-cacher-ng memory
    type: timeseries
    unit: bytes
    description: >-
      Memory in use, without file cache. Its lines come from metrics files the hosts write: an old, missing or
      unreadable file, or a node exporter that does not answer, makes them wrong or leaves gaps ("Service state data
      age" on Janitor: overview shows the files' age, "Host metrics" on Hosts a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: janitor_unit_memory_in_use_bytes{unit="apt-cacher-ng.service"}
        legend: apt-cacher-ng
  - title: apt-cacher-ng CPU
    type: timeseries
    defaults: {custom: {axisSoftMax: 0.01}}
    unit: percentunit
    description: >-
      100% is one core. Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a
      node exporter that does not answer, makes them wrong or leaves gaps ("Service state data age" on Janitor:
      overview shows the files' age, "Host metrics" on Hosts a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: rate(janitor_unit_cpu_seconds_total{unit="apt-cacher-ng.service"}[5m])
        legend: apt-cacher-ng
