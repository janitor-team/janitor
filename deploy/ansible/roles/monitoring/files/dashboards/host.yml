---
# Rendered by templates/dashboard.json.j2.
title: Hosts
uid: janitor-host
tags: [janitor, core, web, control, worker, hosts, caddy, prometheus, grafana, jaeger, pushgateway]
description: Each host, its services, Caddy, Prometheus, Grafana, the health checker (blackbox exporter), Jaeger and the Pushgateway.
panels:
  - title: Status
    type: row
  - title: Host metrics
    type: stat
    unit: short
    width: 8
    requires: [enable_node_exporter]
    defaults: &up_down
      mappings:
        - type: value
          options:
            "0": {text: down, color: red, index: 0}
            "1": {text: up, color: green, index: 1}
        - type: special
          options: {match: "null", result: {text: no data, color: red, index: 9}}
    options: &background
      colorMode: background
      graphMode: none
    targets:
      - expr: sort_by_label(max_over_time(up{job="node"}[2m]), "host")
        legend: "{{host}}"
  - title: Caddy metrics
    type: stat
    unit: short
    width: 4
    defaults: *up_down
    options: *background
    targets:
      - expr: max_over_time(up{job="caddy"}[2m])
        legend: caddy
  - title: Prometheus metrics
    type: stat
    unit: short
    width: 4
    defaults: *up_down
    options: *background
    targets:
      - expr: max_over_time(up{job="prometheus"}[2m])
        legend: prometheus
  - title: Grafana metrics
    type: stat
    unit: short
    width: 4
    defaults: *up_down
    options: *background
    targets:
      - expr: max_over_time(up{job="grafana"}[2m])
        legend: grafana
  - title: Health checker metrics
    type: stat
    unit: short
    width: 4
    requires: [enable_blackbox_exporter]
    defaults: *up_down
    options: *background
    targets:
      - expr: max_over_time(up{job="blackbox"}[2m])
        legend: health checker
  - title: Jaeger metrics
    type: stat
    unit: short
    width: 8
    requires: [enable_tracing]
    defaults: *up_down
    options: *background
    targets:
      - expr: max_over_time(up{job="jaeger"}[2m])
        legend: jaeger
  - title: Pushgateway metrics
    type: stat
    unit: short
    width: 8
    requires: [enable_pushgateway]
    defaults: *up_down
    options: *background
    targets:
      - expr: max_over_time(up{job="pushgateway"}[2m])
        legend: pushgateway
  - title: Health checker configuration loaded
    type: stat
    unit: short
    width: 8
    requires: [enable_blackbox_exporter]
    defaults:
      mappings:
        - type: value
          options:
            "0": {text: failed, color: red, index: 0}
            "1": {text: loaded, color: green, index: 1}
        - type: special
          options: {match: "null", result: {text: no data, color: red, index: 9}}
    options: *background
    targets:
      - expr: last_over_time(blackbox_exporter_config_last_reload_successful[2m])
        legend: health checker
  - title: Hosts
    type: row
    requires: [enable_node_exporter]
  - title: CPU busy per host
    type: timeseries
    defaults: {color: {mode: shades, fixedColor: blue}}
    newline: true
    unit: percentunit
    requires: [enable_node_exporter]
    targets:
      - expr: 1 - avg by (host) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m]))
        legend: "{{host}}"
  - title: "Load average per core, per host"
    type: timeseries
    defaults: {color: {mode: shades, fixedColor: blue}}
    unit: short
    requires: [enable_node_exporter]
    targets:
      - expr: node_load1{job="node"} / on (host) count by (host) (node_cpu_seconds_total{mode="idle"})
        legend: "{{host}} 1 minute, per core"
      - expr: node_load15{job="node"} / on (host) count by (host) (node_cpu_seconds_total{mode="idle"})
        legend: "{{host}} 15 minutes, per core"
  - title: Memory used per host
    type: timeseries
    description: >-
      Used is the total minus the memory the kernel says is available. OutOfMemoryKills fires when the
      kernel kills a process for lack of memory, which no panel counts: the kernel log on that host
      (journalctl -k) names the process.
    defaults: {color: {mode: shades, fixedColor: blue}}
    overrides:
      - matcher: {id: byRegexp, options: ".* total$"}
        properties: [{id: color, value: {mode: fixed, fixedColor: text}}]
    unit: bytes
    requires: [enable_node_exporter]
    targets:
      - expr: node_memory_MemTotal_bytes{job="node"} - node_memory_MemAvailable_bytes{job="node"}
        legend: "{{host}} used"
      - expr: node_memory_MemTotal_bytes{job="node"}
        legend: "{{host}} total"
  - title: Free disk space per host and mount
    type: timeseries
    defaults: {color: {mode: shades, fixedColor: blue}}
    unit: bytes
    requires: [enable_node_exporter]
    targets:
      - expr: node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}
        legend: "{{host}} {{mountpoint}}"
  - title: Disk reads and writes per host
    type: timeseries
    unit: Bps
    width: 8
    requires: [enable_node_exporter]
    description: >-
      Whole disks only (sd, vd, xvd and hd disks, NVMe namespaces, eMMC and SD cards). Partitions,
      LVM, dm-crypt, software RAID and loop devices repeat the bytes of the disks under them, so they are
      left out. nbd and rbd devices are left out too, their bytes show in "Network traffic per host".
    targets:
      - expr: sum by (host) (rate(node_disk_read_bytes_total{job="node",device=~"(sd|vd|xvd|hd)[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+"}[5m]))
        legend: "{{host}} read"
      - expr: sum by (host) (rate(node_disk_written_bytes_total{job="node",device=~"(sd|vd|xvd|hd)[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+"}[5m]))
        legend: "{{host}} written"
  - title: Disk time busy per host and disk
    type: timeseries
    defaults: {color: {mode: shades, fixedColor: blue}}
    unit: percentunit
    width: 8
    requires: [enable_node_exporter]
    description: >-
      100% is a disk busy all the time. Whole disks only, as in "Disk reads and writes per host". The
      column "busiest disk, time busy" in "Resource use per host" on Janitor: overview shows the highest line of each host.
    targets:
      - expr: rate(node_disk_io_time_seconds_total{job="node",device=~"(sd|vd|xvd|hd)[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+"}[5m])
        legend: "{{host}} {{device}}"
  - title: Network traffic per host
    type: timeseries
    unit: Bps
    width: 8
    requires: [enable_node_exporter]
    description: >-
      Network cards and modems only (en, eth, ib, wl and ww names). Bridges, bonds, VLANs, VPN tunnels
      and container interfaces carry bytes that a network card also carries, or bytes that stay on the
      host. Loopback bytes never leave the host. So they are left out. A name with a PCI domain (a
      capital P, as in enP2p1s0) is left out too: on a cloud host it is often a faster second path for
      the main card, which already counts its bytes. A real card with such a name, on a server with more
      than one PCI domain, is not counted either.
    targets:
      - expr: sum by (host) (rate(node_network_receive_bytes_total{job="node",device=~"(en|eth|ib|wl|ww)[a-zA-OQ-Z0-9]+"}[5m]))
        legend: "{{host}} received"
      - expr: sum by (host) (rate(node_network_transmit_bytes_total{job="node",device=~"(en|eth|ib|wl|ww)[a-zA-OQ-Z0-9]+"}[5m]))
        legend: "{{host}} sent"
  - title: Service states
    type: row
    requires: [enable_node_exporter]
  - title: "Service, socket and timer states per host"
    type: stat
    unit: short
    width: 24
    height: 13
    description: >-
      The playbook's long-running units on each host. Green: up. Yellow: restarted in the last hour, or starting,
      stopping, reloading or in another short-lived state. Red: stopped, restarting in a loop (more than 2 restarts
      in 15 minutes or more than 3 in an hour) or failed. A unit whose service state is gone leaves the panel: the
      unit was removed, it was a mail filter run that has ended (systemd then drops its unit), the node exporter of
      its host has not answered for 2 minutes ("Host metrics"), or the service states file of its host is missing or
      cannot be read. no data means no unit has a service state. The helper timers' services, which are normally
      inactive, are left out unless they fail. Any other unit in the service states shows here only when it fails or
      restarts in a loop. A failed sbuild chroot rebuild that waits to retry shows as failed. Its value comes from
      metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does not answer,
      makes it wrong or empty ("Service state data age, per host and file" shows the files' age, "Host metrics" a
      node exporter that does not answer).
    requires: [enable_node_exporter]
    defaults:
      mappings:
        - type: value
          options:
            "0": {text: up, color: green, index: 0}
            "1": {text: restarted, color: yellow, index: 1}
            "2": {text: "starting, stopping or reloading", color: yellow, index: 2}
            "4": {text: stopped, color: red, index: 4}
            "5": {text: restarting in a loop, color: red, index: 5}
            "6": {text: failed, color: red, index: 6}
        - type: special
          options: {match: "null", result: {text: no data, color: red, index: 9}}
    options:
      colorMode: background
      graphMode: none
      textMode: value_and_name
      text: {titleSize: 11, valueSize: 18}
      minVizWidth: 150
      minVizHeight: 50
    targets:
      - expr: >-
          sort_by_label(max by (host, unit) (
            6 * ((janitor_unit_state{state="failed"} or ((last_over_time(janitor_unit_state{state="failed"}[2m]) and
            (max_over_time(timestamp(janitor_unit_state{state="failed"})[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
            or 6 * ((janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"} or
            ((last_over_time(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"}[2m]) and
            (max_over_time(timestamp(janitor_unit_state{unit="janitor-sbuild-chroot.service", state="activating"})[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
            and on (host, unit) ((janitor_unit_result{unit="janitor-sbuild-chroot.service", result!="success"} or
            ((last_over_time(janitor_unit_result{unit="janitor-sbuild-chroot.service", result!="success"}[2m]) and
            (max_over_time(timestamp(janitor_unit_result{unit="janitor-sbuild-chroot.service", result!="success"})[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
            or 5 *
            ((round(increase(janitor_unit_restarts_total[15m])) > 2
            or
            round(increase(janitor_unit_restarts_total[1h])) > 3) > bool 0)
            and on (host, unit) (janitor_unit_restarts_total or ((last_over_time(janitor_unit_restarts_total[2m]) and
            (max_over_time(timestamp(janitor_unit_restarts_total)[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1))
            or 4 * ((janitor_unit_state{state="inactive",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"} or ((last_over_time(janitor_unit_state{state="inactive",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"}[2m]) and
            (max_over_time(timestamp(janitor_unit_state{state="inactive",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"})[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
            or 2 * ((janitor_unit_state{state!~"active|inactive|failed",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"} or
            ((last_over_time(janitor_unit_state{state!~"active|inactive|failed",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"}[2m]) and
            (max_over_time(timestamp(janitor_unit_state{state!~"active|inactive|failed",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"})[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)
            or
            ((increase(janitor_unit_restarts_total{unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"}[1h]) > bool 0)
            and on (host, unit) (janitor_unit_restarts_total{
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"} or ((last_over_time(janitor_unit_restarts_total{
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"}[2m]) and
            (max_over_time(timestamp(janitor_unit_restarts_total{
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"})[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)))
            or 0 * ((janitor_unit_state{state="active",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"} or ((last_over_time(janitor_unit_state{state="active",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"}[2m]) and
            (max_over_time(timestamp(janitor_unit_state{state="active",
            unit=~"janitor-.*|(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service",
            unit!~"janitor-(unit-metrics|run-metrics|sbuild-chroot)[.]service"})[2m:10s]) >= on (host) group_left
            max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1)) == 1)), "host", "unit")
        legend: "{{unit}} on {{host}}"
  - title: "Software Janitor runs on, and its monitoring: last started and stopped"
    type: table
    width: 24
    height: 21
    description: >-
      The Janitor services have the same table on their own dashboards. no data: the unit appeared less than a
      minute ago (the count needs two readings). "last result": systemd sets it back to success when it starts the
      unit again. A crash that systemd restarted shows in the restart count, and in last stopped until the next
      manual restart. The cause is in the unit's journal. A unit whose service state is gone leaves the table, for
      the same causes as on "Service, socket and timer states per host". Its value comes from metrics files the
      hosts write: an old, missing or unreadable file, or a node exporter that does not answer, makes it wrong or
      empty ("Service state data age, per host and file" shows the files' age, "Host metrics" a node exporter that
      does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: |-
          1000 *
          last_over_time(janitor_unit_active_since_seconds{unit=~"(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service"}[2m])
        format: table
        instant: true
      - expr: |-
          1000 *
          last_over_time(janitor_unit_inactive_since_seconds{unit=~"(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service"}[2m])
        format: table
        instant: true
      - expr: |-
          round(increase(janitor_unit_restarts_total{unit=~"(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service"}[24h]))
          and on (host, unit)
          last_over_time(janitor_unit_restarts_total{unit=~"(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service"}[2m])
        format: table
        instant: true
      - expr: |-
          (janitor_unit_result{unit=~"(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service"}
          or
          ((last_over_time(janitor_unit_result{unit=~"(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service"}[2m])
          and
          (max_over_time(timestamp(janitor_unit_result{unit=~"(gitea|garage|jaeger|prometheus|grafana|caddy|redis-server)[.]service|postfix[.]service|postgresql@.+[.]service|prometheus-.+[.]service"})[2m:10s])
          >= on (host) group_left
          max by (host) (max_over_time(timestamp(node_time_seconds{job="node"})[2m:10s])))) unless on (host) up{job="node"} == 1))
        format: table
        instant: true
    transformations:
      - id: merge
        options: {}
      - id: organize
        options:
          excludeByName: {Time: true, job: true, instance: true, __name__: true, "Value #D": true}
          renameByName:
            "Value #A": last started
            "Value #B": last stopped
            "Value #C": restarts by systemd, 24 hours
            result: last result
      - id: sortBy
        options: {sort: [{field: "restarts by systemd, 24 hours", desc: true}]}
    overrides:
      - matcher: {id: byRegexp, options: "last (started|stopped)"}
        properties:
          - {id: unit, value: dateTimeFromNow}
      - matcher: {id: byName, options: "restarts by systemd, 24 hours"}
        properties:
          - id: custom.cellOptions
            value: {type: color-background}
          - id: custom.wrapHeaderText
            value: true
          - id: mappings
            value: [{type: special, options: {match: "null", result: {text: no data, color: transparent, index: 9}}}]
          - id: color
            value: {mode: thresholds}
          - id: thresholds
            value:
              mode: absolute
              steps:
                - {color: green, value: null}
                - {color: yellow, value: 1}
                - {color: red, value: 5}
      - matcher: {id: byName, options: "host"}
        properties:
          - {id: custom.width, value: 90}
      - matcher: {id: byName, options: "last started"}
        properties:
          - {id: custom.width, value: 110}
      - matcher: {id: byName, options: "last stopped"}
        properties:
          - {id: custom.width, value: 110}
      - matcher: {id: byName, options: "restarts by systemd, 24 hours"}
        properties:
          - {id: custom.width, value: 120}
      - matcher: {id: byName, options: "last result"}
        properties:
          - {id: custom.width, value: 100}
      - matcher: {id: byName, options: last result}
        properties:
          - id: custom.cellOptions
            value: {type: color-text}
          - id: mappings
            value:
              - type: value
                options:
                  success: {color: text, index: 0}
              - type: regex
                options:
                  pattern: .+
                  result: {color: red, index: 1}
  - title: "Service state data age, per host and file"
    type: timeseries
    unit: s
    width: 24
    defaults:
      color: {mode: shades, fixedColor: blue}
      custom: {thresholdsStyle: {mode: line}, axisSoftMax: 360}
      thresholds: {mode: absolute, steps: [{color: transparent, value: null}, {color: red, value: 300}]}
    description: >-
      How old each file of service states and run counts is. Over
      5 minutes (the red line), ServiceStatesMissingOrOld fires. "Service state data age" on Janitor: overview shows the oldest per host. A service
      states or run counts file that was never written has no line here, and "Service state data age" on Janitor: overview names its host.
    requires: [enable_node_exporter]
    targets:
      - expr: >-
          label_replace(time() - (max_over_time(node_textfile_mtime_seconds{file=~".*(units|runs)[.]prom"}[24h])), "file", "$1", "file", ".*/(.+)")
        legend: "{{host}} {{file}}"
  - title: Services
    type: row
  - title: Caddy requests per second by HTTP status
    defaults: {color: {mode: shades, fixedColor: blue}}
    overrides:
      - matcher: {id: byRegexp, options: "(^|.* )5[0-9][0-9]$"}
        properties: [{id: color, value: {mode: fixed, fixedColor: red}}]
      - matcher: {id: byRegexp, options: "^503$"}
        properties: [{id: color, value: {mode: fixed, fixedColor: blue}}]
    type: timeseries
    unit: reqps
    description: >-
      Requests Caddy served. Workers ask the runner for work through Caddy, and while there is no work to
      hand out the runner answers 503 (queue empty), about once every 5 seconds per worker. So a steady 503
      line is normal, so it is blue, not red like the other 5xx codes. The runner also answers 503 when it cannot
      reach PostgreSQL or a forge limits it. "Requests for work per hour, per worker login (all campaigns)" on Janitor: runner shows how many
      found the queue empty. The site also answers 503 when PostgreSQL has no room for its query ("PostgreSQL out of
      resources" in "Server errors per hour" on Janitor: site counts these) or when it cannot get a diff from the differ.
    targets:
      - expr: |-
          sum by (code) ((((caddy_http_request_duration_seconds_count{handler="subroute"} unless caddy_http_request_duration_seconds_count{handler="subroute"}
          offset 5m) and on (job, instance) (up offset 5m == 1)) or increase(caddy_http_request_duration_seconds_count{handler="subroute"}[5m])) / 300)
        legend: "{{code}}"
  - title: "Caddy request time, slowest 10% take at least"
    type: timeseries
    unit: s
    description: >-
      The line is estimated from fixed time buckets. When nearly every request is faster than the limit of the first
      bucket, the line reads just under that limit, and the real time can be lower.
    targets:
      - expr: |-
          histogram_quantile(0.9, sum by (le) ((((caddy_http_request_duration_seconds_bucket{handler="subroute"} unless
          caddy_http_request_duration_seconds_bucket{handler="subroute"} offset 5m) and on (job, instance) (up offset 5m == 1)) or
          increase(caddy_http_request_duration_seconds_bucket{handler="subroute"}[5m])) / 300))
        legend: slowest 10% take at least
  - title: Caddy requests being answered
    type: timeseries
    unit: short
    targets:
      - expr: sum(caddy_http_requests_in_flight{handler="subroute"})
        legend: being answered
  - title: Caddy memory
    type: timeseries
    unit: bytes
    description: >-
      Memory in use, without file cache. Its lines come from metrics files the hosts write: an old, missing or
      unreadable file, or a node exporter that does not answer, makes them wrong or leaves gaps ("Service state data
      age, per host and file" shows the files' age, "Host metrics" a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: janitor_unit_memory_in_use_bytes{unit="caddy.service"}
        legend: caddy
  - title: Caddy CPU
    type: timeseries
    defaults: {custom: {axisSoftMax: 0.01}}
    unit: percentunit
    description: >-
      100% is one core. Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a
      node exporter that does not answer, makes them wrong or leaves gaps ("Service state data age, per host and
      file" shows the files' age, "Host metrics" a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: rate(janitor_unit_cpu_seconds_total{unit="caddy.service"}[5m])
        legend: caddy
  - title: Time series in Prometheus' memory
    type: timeseries
    unit: short
    targets:
      - expr: prometheus_tsdb_head_series
        legend: series
  - title: "Failed alert rule checks per hour, per rule group"
    type: timeseries
    unit: short
    defaults: {color: {mode: shades, fixedColor: red}}
    targets:
      - expr: sum by (rule_group) (increase(prometheus_rule_evaluation_failures_total[1h]))
        legend: "{{rule_group}}"
  - title: "Time to collect metrics, slowest per source"
    type: timeseries
    unit: s
    targets:
      - expr: max by (job) (scrape_duration_seconds)
        legend: "{{job}}"
  - title: Grafana requests per second by HTTP status
    defaults: {color: {mode: shades, fixedColor: blue}}
    overrides:
      - matcher: {id: byRegexp, options: "(^|.* )5[0-9][0-9]$"}
        properties: [{id: color, value: {mode: fixed, fixedColor: red}}]
    type: timeseries
    unit: reqps
    targets:
      - expr: |-
          sum by (status_code) ((((grafana_http_request_duration_seconds_count unless grafana_http_request_duration_seconds_count offset 5m) and on (job,
          instance) (up offset 5m == 1)) or increase(grafana_http_request_duration_seconds_count[5m])) / 300)
        legend: "{{status_code}}"
  - title: "Grafana request time, slowest 10% take at least"
    type: timeseries
    unit: s
    description: >-
      The line is estimated from fixed time buckets. When nearly every request is faster than the limit of the first
      bucket, the line reads just under that limit, and the real time can be lower.
    targets:
      - expr: |-
          histogram_quantile(0.9, sum by (le) ((((grafana_http_request_duration_seconds_bucket unless grafana_http_request_duration_seconds_bucket offset 5m)
          and on (job, instance) (up offset 5m == 1)) or increase(grafana_http_request_duration_seconds_bucket[5m])) / 300))
        legend: slowest 10% take at least
  - title: Prometheus requests per second by HTTP status
    defaults: {color: {mode: shades, fixedColor: blue}}
    overrides:
      - matcher: {id: byRegexp, options: "(^|.* )5[0-9][0-9]$"}
        properties: [{id: color, value: {mode: fixed, fixedColor: red}}]
    type: timeseries
    unit: reqps
    targets:
      - expr: |-
          sum by (code) ((((prometheus_http_requests_total unless prometheus_http_requests_total offset 5m) and on (job, instance) (up offset 5m == 1)) or
          increase(prometheus_http_requests_total[5m])) / 300)
        legend: "{{code}}"
  - title: Prometheus request time, mean
    type: timeseries
    unit: s
    targets:
      - expr: |-
          sum((((prometheus_http_request_duration_seconds_sum unless prometheus_http_request_duration_seconds_sum offset 5m) and on (job, instance) (up offset
          5m == 1)) or increase(prometheus_http_request_duration_seconds_sum[5m])) / 300) / sum((((prometheus_http_request_duration_seconds_count unless
          prometheus_http_request_duration_seconds_count offset 5m) and on (job, instance) (up offset 5m == 1)) or
          increase(prometheus_http_request_duration_seconds_count[5m])) / 300)
        legend: prometheus
  - title: "Health checks failing, per service and host"
    type: timeseries
    unit: short
    defaults: {color: {mode: shades, fixedColor: red}}
    requires: [enable_blackbox_exporter]
    targets:
      - expr: sum by (job, service, host) (probe_success == bool 0)
        legend: "{{job}} {{service}}{{host}}"
  - title: Trace records Jaeger received per second
    defaults: {color: {mode: shades, fixedColor: blue}}
    overrides:
      - matcher: {id: byRegexp, options: ".* (refused|failed)$"}
        properties: [{id: color, value: {mode: fixed, fixedColor: red}}]
    type: timeseries
    unit: short
    requires: [enable_tracing]
    targets:
      - expr: sum by (receiver) (rate({__name__=~"otelcol_receiver_accepted_spans(_total)?"}[5m]))
        legend: "{{receiver}}"
      - expr: sum by (receiver) (rate({__name__=~"otelcol_receiver_refused_spans(_total)?"}[5m]))
        legend: "{{receiver}} refused"
  - title: Trace records Jaeger stored per second
    defaults: {color: {mode: shades, fixedColor: blue}}
    overrides:
      - matcher: {id: byRegexp, options: ".* (refused|failed)$"}
        properties: [{id: color, value: {mode: fixed, fixedColor: red}}]
    type: timeseries
    unit: short
    requires: [enable_tracing]
    targets:
      - expr: sum by (exporter) (rate({__name__=~"otelcol_exporter_sent_spans(_total)?"}[5m]))
        legend: "{{exporter}}"
      - expr: sum by (exporter) (rate({__name__=~"otelcol_exporter_send_failed_spans(_total)?"}[5m]))
        legend: "{{exporter}} failed"
  - title: Metric groups on the Pushgateway
    type: timeseries
    unit: short
    description: >-
      Only a worker on the control host pushes, after each run, and all its pushes share one
      group. With workers only on other hosts this stays at 0.
    requires: [enable_pushgateway]
    defaults: {noValue: "the counts could not be read in this time range"}
    targets:
      - expr: count(push_time_seconds) or (0 * (max(max_over_time(up{job="pushgateway"}[2m])) == 1))
        legend: groups
  - title: Memory and CPU of the monitoring tools and metrics collectors
    type: row
    requires: [enable_node_exporter]
  - title: Memory of the monitoring tools
    type: timeseries
    unit: bytes
    description: >-
      Memory in use, without file cache. Its lines come from metrics files the hosts write: an old, missing or
      unreadable file, or a node exporter that does not answer, makes them wrong or leaves gaps ("Service state data
      age, per host and file" shows the files' age, "Host metrics" a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: janitor_unit_memory_in_use_bytes{unit=~"(prometheus|grafana|jaeger|prometheus-pushgateway)[.]service"}
        legend: "{{host}} {{unit}}"
  - title: CPU of the monitoring tools
    type: timeseries
    defaults: {custom: {axisSoftMax: 0.01}}
    unit: percentunit
    description: >-
      100% is one core. Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a
      node exporter that does not answer, makes them wrong or leaves gaps ("Service state data age, per host and
      file" shows the files' age, "Host metrics" a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: rate(janitor_unit_cpu_seconds_total{unit=~"(prometheus|grafana|jaeger|prometheus-pushgateway)[.]service"}[5m])
        legend: "{{host}} {{unit}}"
  - title: Memory of the metrics collectors
    type: timeseries
    unit: bytes
    description: >-
      Memory in use, without file cache. Every Debian Prometheus exporter, the blackbox exporter (the health
      checker) too. Its lines come from metrics files the hosts write: an old, missing or unreadable file, or a node
      exporter that does not answer, makes them wrong or leaves gaps ("Service state data age, per host and file"
      shows the files' age, "Host metrics" a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: janitor_unit_memory_in_use_bytes{unit=~"prometheus-.+-exporter[.]service"}
        legend: "{{host}} {{unit}}"
  - title: CPU of the metrics collectors
    type: timeseries
    defaults: {custom: {axisSoftMax: 0.01}}
    unit: percentunit
    description: >-
      100% is one core. Every Debian Prometheus exporter, the blackbox exporter (the health checker) too. Its lines
      come from metrics files the hosts write: an old, missing or unreadable file, or a node exporter that does not
      answer, makes them wrong or leaves gaps ("Service state data age, per host and file" shows the files' age,
      "Host metrics" a node exporter that does not answer).
    requires: [enable_node_exporter]
    targets:
      - expr: rate(janitor_unit_cpu_seconds_total{unit=~"prometheus-.+-exporter[.]service"}[5m])
        legend: "{{host}} {{unit}}"
