---
- name: Restart prometheus
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  ansible.builtin.systemd:
    name: prometheus.service
    scope: user
    daemon_reload: true
    state: restarted

- name: Restart grafana
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  ansible.builtin.systemd:
    name: grafana.service
    scope: user
    daemon_reload: true
    state: restarted
