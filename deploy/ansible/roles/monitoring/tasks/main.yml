---
# Optional (enable_monitoring): Prometheus scraping the janitor services
# on the control host, and Grafana showing them, both on loopback.
- name: Create the Prometheus and Grafana directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0750"
  loop:
    - "{{ prometheus_home }}"
    - "{{ prometheus_home }}/data"
    - "{{ grafana_home }}"
    - "{{ grafana_home }}/data"
    - "{{ grafana_home }}/provisioning"
    - "{{ grafana_home }}/provisioning/datasources"
    - "{{ grafana_home }}/provisioning/dashboards"
    - "{{ grafana_home }}/upstream"
    - "{{ grafana_home }}/dashboards"

- name: Deploy Prometheus's scrape configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_home }}/prometheus.yml"
    owner: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart prometheus

- name: Deploy Grafana's admin password
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ grafana_home }}/grafana.env"
    owner: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  notify: Restart grafana

- name: Deploy Grafana's datasource and dashboard provisioning
  ansible.builtin.template:
    src: "{{ item }}.yaml.j2"
    dest: "{{ grafana_home }}/provisioning/{{ item }}/janitor.yaml"
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop: [datasources, dashboards]
  notify: Restart grafana

- name: Fetch janitor.debian.net's dashboards
  ansible.builtin.get_url:
    url: "{{ grafana_dashboards_url }}/{{ item.name }}.json"
    dest: "{{ grafana_home }}/upstream/{{ item.name }}.json"
    checksum: "{{ item.checksum }}"
    timeout: 60
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ grafana_dashboards }}"

- name: Read the fetched dashboards
  ansible.builtin.slurp:
    src: "{{ grafana_home }}/upstream/{{ item.name }}.json"
  register: grafana_upstream
  loop: "{{ grafana_dashboards }}"

- name: Point the dashboards' Prometheus panels at this Prometheus
  ansible.builtin.copy:
    content: >-
      {{ item.content | b64decode
         | replace('"${DS_PROMETHEUS}"', '"prometheus"')
         | replace('"Debian Janitor Prometheus"', '"prometheus"') }}
    dest: "{{ grafana_home }}/dashboards/{{ item.item.name }}.json"
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ grafana_upstream.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Create the quadlet unit directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy the Prometheus quadlet unit
  ansible.builtin.template:
    src: prometheus.container.j2
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/prometheus.container"
    owner: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart prometheus

- name: Deploy the Grafana quadlet unit
  ansible.builtin.template:
    src: grafana.container.j2
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/grafana.container"
    owner: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart grafana

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Start Prometheus and Grafana
  # The first start pulls the images.
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    scope: user
    daemon_reload: true
    state: started
  loop: [prometheus, grafana]

- name: Wait for Prometheus and Grafana
  ansible.builtin.uri:
    url: "{{ item }}"
  register: monitoring_health
  until: monitoring_health.status == 200
  retries: 30
  delay: 2
  loop:
    - "http://127.0.0.1:{{ prometheus_port }}/-/ready"
    - "http://127.0.0.1:{{ grafana_port }}/api/health"
