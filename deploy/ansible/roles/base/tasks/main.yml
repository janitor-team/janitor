---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - podman
      - buildah
      - git
      - make
      - curl
      - ca-certificates
      - openssl
      - gnupg
      - jq
      # become_user needs setfacl for its temporary files.
      - acl
    state: present
    update_cache: true

- name: Enable lingering for the deploy user
  # Keeps the user's systemd units running with nobody logged in.
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_user }}
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Get the deploy user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Start the deploy user's D-Bus session bus
  # Without it podman cannot reach systemd and podman exec fails on cgroups.
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  ansible.builtin.systemd:
    name: dbus.socket
    scope: user
    enabled: true
    state: started

- name: Add janitor_extra_hosts to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ item.key | regex_escape }}$'
    line: "{{ item.value }} {{ item.key }}"
  loop: "{{ janitor_extra_hosts | dict2items }}"
