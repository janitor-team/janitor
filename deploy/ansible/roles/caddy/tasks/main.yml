---
- name: Install Caddy
  ansible.builtin.apt:
    name:
      - caddy
      - openssl
    state: present

- name: Generate a self-signed certificate for a host without a real domain
  # Only for test hosts (caddy_self_signed); each worker host trusts it.
  # TLS clients match the name against subjectAltName, not the CN.
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650
    -keyout /etc/caddy/janitor.key
    -out /etc/caddy/janitor.crt
    -subj "/CN={{ janitor_domain }}"
    -addext "subjectAltName={{ 'IP' if janitor_domain is match('^[0-9.]+$') else 'DNS' }}:{{ janitor_domain }}"
    -addext "basicConstraints=critical,CA:FALSE"
  args:
    creates: /etc/caddy/janitor.crt
  when: caddy_self_signed | default(false) | bool
  notify: Restart caddy

- name: Let caddy read the self-signed key
  ansible.builtin.file:
    path: /etc/caddy/janitor.key
    owner: root
    group: caddy
    mode: "0640"
  when: caddy_self_signed | default(false) | bool
  notify: Restart caddy

- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Restart caddy

- name: Start caddy
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
