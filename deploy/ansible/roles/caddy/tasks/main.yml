---
# apt_key shells out to the apt-key binary, which Debian dropped outright as
# of trixie (deprecated since bullseye) - the module has no fallback and
# just fails "command not found". Fetch + gpg --dearmor by hand instead,
# the way apt-key itself used to.
- name: Download Caddy's official GPG key
  get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /tmp/caddy-stable-archive-keyring.gpg.key
    mode: "0644"
    # TLS covers transport, but pinning the checksum catches a compromised
    # or silently-rotated key at the source too. Stable across two
    # independent fetches on 2026-08-30 - if Cloudsmith ever rotates
    # this key, this task starts failing loudly instead of silently
    # trusting whatever's there - update the checksum deliberately, don't
    # just delete this line.
    checksum: sha256:783dfee04b19e851a928cd87b34710213ebbe7628f98d9f34595ab83be578c00

- name: Dearmor Caddy's GPG key into the trusted keyring
  command: gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg /tmp/caddy-stable-archive-keyring.gpg.key
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy apt source
  # apt_repository is deprecated as of ansible-core 2.21 in favor of
  # deb822_repository, slated for removal in 2.25 - not broken yet, worth
  # revisiting (with a Vagrant re-validation) before that lands.
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present

- name: Install Caddy
  apt:
    name: caddy
    state: present
    update_cache: true

- name: Generate a self-signed cert for the vagrant HTTPS listener
  # tls internal needs the caddy service account to write to the system
  # trust store, which it isn't sudo'd for here - a plain self-signed
  # cert sidesteps that path entirely. creates: skips regeneration on
  # every re-run, matching the openssl_certificate module's own idempotency
  # without adding that module as a new role dependency.
  command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650
    -keyout /etc/caddy/vagrant-selfsigned.key
    -out /etc/caddy/vagrant-selfsigned.crt
    -subj "/CN={{ janitor_domain }}"
  args:
    creates: /etc/caddy/vagrant-selfsigned.crt
  when: "'vagrant' in group_names"
  notify: restart caddy

- name: Let the caddy service account read the self-signed key
  # openssl req above writes root:root 0600 - the caddy service runs as
  # its own unprivileged account, which that leaves unable to read the
  # key at all ("loading tls app: ... permission denied"), failing the
  # service on every start.
  file:
    path: /etc/caddy/vagrant-selfsigned.key
    owner: root
    group: caddy
    mode: "0640"
  when: "'vagrant' in group_names"
  notify: restart caddy

- name: Deploy Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: restart caddy

- meta: flush_handlers
