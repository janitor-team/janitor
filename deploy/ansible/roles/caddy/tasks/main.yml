---
- name: Install Caddy
  ansible.builtin.apt:
    name:
      - caddy
      - openssl
    state: present

- name: Read the names of the self-signed certificate
  # The names it was made with: openssl prints an IPv6 address in another form.
  ansible.builtin.command: cat /etc/caddy/janitor.san /etc/caddy/janitor.crt
  register: caddy_cert_names
  changed_when: false
  failed_when: false
  when: caddy_self_signed | default(false) | bool

- name: Generate a self-signed certificate for a host without a real domain
  # Only for test hosts (caddy_self_signed). Each worker host trusts it.
  # TLS clients match the name against subjectAltName, not the CN.
  ansible.builtin.shell: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650
    -keyout /etc/caddy/janitor.key
    -out /etc/caddy/janitor.crt
    -subj "/CN={{ janitor_domain }}"
    -addext "subjectAltName={{ caddy_cert_sans | join(',') }}"
    -addext "basicConstraints=critical,CA:FALSE"
    && echo "{{ caddy_cert_sans | join(',') }}" > /etc/caddy/janitor.san
  when:
    - caddy_self_signed | default(false) | bool
    - caddy_cert_names.rc != 0 or caddy_cert_names.stdout_lines[0] != caddy_cert_sans | join(',')
  vars:
    caddy_cert_sans: >-
      {{ [('IP:' if janitor_domain is match('^[0-9.]+$') or ':' in janitor_domain else 'DNS:') + janitor_domain] }}
  changed_when: true
  notify: Restart caddy

- name: Let caddy read the self-signed key
  ansible.builtin.file:
    path: /etc/caddy/janitor.key
    owner: root
    group: caddy
    mode: "0640"
  when: caddy_self_signed | default(false) | bool
  notify: Restart caddy

- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Restart caddy

- name: Let the deploy user read Caddy's access log in the journal
  # It runs the playbook with sudo already. This is only for reading logs.
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: systemd-journal
    append: true

- name: Start caddy
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
