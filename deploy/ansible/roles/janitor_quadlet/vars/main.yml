---
# create-sbuild-chroot-unshare.py's mmdebstrap call, written to a .partial name and moved into place.
janitor_quadlet_sbuild_chroot_build: >-
  mmdebstrap --variant=buildd {{ janitor_distribution }}
  /root/.cache/sbuild/{{ janitor_sbuild_chroot }}.partial.tar.xz
  {{ janitor_archive_mirror }} --mode=unshare --arch=amd64 --components=main &&
  mv /root/.cache/sbuild/{{ janitor_sbuild_chroot }}.partial.tar.xz
  /root/.cache/sbuild/{{ janitor_sbuild_chroot }}.tar.xz
