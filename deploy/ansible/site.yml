---
# One play per inventory group. A single host in every group gets all of
# them. See inventory.ini.
- name: Validate secret vars
  hosts: janitor
  become: true
  gather_facts: false
  tasks:
    - name: Check secret vars hold no characters that break their use
      # breezy_whoami is left out:
      # "Name <email>" needs @ and spaces.
      ansible.builtin.assert:
        that:
          - not (lookup('vars', item, default='') | string | regex_search("[@:/%'\"\\s]"))
        fail_msg: >-
          {{ item }} contains one of @ : / % ' " or whitespace, which break
          the PostgreSQL URI or the config files it is written into.
        quiet: true
      loop:
        - janitor_db_password
        - breezy_github_token
        - oauth_client_id
        - oauth_client_secret
      when: (lookup('vars', item, default='') | string | length) > 0

    - name: Check a site login has an OpenID Connect provider
      ansible.builtin.assert:
        that:
          - oauth_base_url | default('') | length > 0
        fail_msg: >-
          oauth_client_id needs oauth_base_url, an OpenID Connect provider
          that serves /.well-known/openid-configuration (GitHub does not).
        quiet: true
      when: (oauth_client_id | default('') | string | length) > 0

    - name: Check each extra sbuild apt source
      ansible.builtin.assert:
        that:
          - item.name | default('') | string is match('^[a-z0-9][a-z0-9-]*$')
          - item.uris | default('') | length > 0
          - item.suites | default('') | length > 0
          - item.components | default('') | length > 0
          - item.key | default('') | string is match('.+[.](asc|gpg)$')
          - sources | map(attribute='name', default='') | select('equalto', item.name) | list | length == 1
        fail_msg: >-
          Each entry of janitor_sbuild_extra_sources and
          janitor_sbuild_campaign_extra_sources needs a name of its own
          across both (a-z, 0-9 and -), uris, suites, components and a key
          file ending in .asc or .gpg.
        quiet: true
      loop: "{{ sources }}"
      loop_control:
        label: "{{ item.name | default('') }}"
      vars:
        sources: "{{ janitor_sbuild_extra_sources + (janitor_sbuild_campaign_extra_sources.values() | flatten(levels=1)) }}"

    - name: Check janitor_sbuild_campaigns and janitor_sbuild_campaign_extra_sources
      ansible.builtin.assert:
        that:
          - janitor_sbuild_campaign_extra_sources.keys() | difference(janitor_sbuild_campaigns.keys()) | length == 0
          - janitor_sbuild_campaigns.values() | unique | list | length == janitor_sbuild_campaigns | length
          - janitor_sbuild_chroot_aliases is not contains(janitor_sbuild_chroot)
        fail_msg: >-
          janitor_sbuild_campaign_extra_sources may only name campaigns in
          janitor_sbuild_campaigns ({{ janitor_sbuild_campaigns.keys() | join(', ') }}),
          and each campaign there needs a build distribution of its own,
          whose tarball is not janitor_sbuild_chroot.
        quiet: true

    - name: Check janitor_worker_concurrency is a whole number of at least 1
      ansible.builtin.assert:
        that:
          - janitor_worker_concurrency | string is match('^[1-9][0-9]*$')
        fail_msg: janitor_worker_concurrency must be a whole number of at least 1.
        quiet: true

    - name: Check every worker has its own password
      ansible.builtin.assert:
        that:
          - passwords | select('equalto', '') | list | length == 0
          - passwords | select('search', "[@:/%'\"\\s]") | list | length == 0
          - passwords | unique | length == passwords | length
        fail_msg: >-
          Every janitor_workers entry needs a password of its own, without
          @ : / % ' " or whitespace.
        quiet: true
      vars:
        passwords: "{{ janitor_workers | map(attribute='password') | map('string') | list }}"

    - name: Check auto_upload has a dput host and a signing key
      ansible.builtin.assert:
        that:
          - auto_upload_dput_host | length > 0
          - enable_auto_upload_target | bool or auto_upload_debsign_keyid | length > 0
        fail_msg: >-
          enable_auto_upload needs auto_upload_dput_host and, without
          enable_auto_upload_target, auto_upload_debsign_keyid.
        quiet: true
      when: enable_auto_upload | bool

    - name: Check the MTA has a domain and pipes only into an installed mail filter
      ansible.builtin.assert:
        that:
          - mta_domains | length > 0
          - enable_mail_filter | bool or mta_mail_filter_recipients | length == 0
          - mta_mail_filter_recipients | length <= (mail_filter_max_instances | int) // 2
        fail_msg: >-
          enable_mta needs mta_domains, mta_mail_filter_recipients needs
          enable_mail_filter, and at most half of mail_filter_max_instances
          recipients (systemd drops filter connections beyond it).
        quiet: true
      when: enable_mta | bool

    - name: Check the apt-cacher-ng host lists
      ansible.builtin.assert:
        that:
          - apt_cacher_ng_clients | select('equalto', '') | list | length == 0
          - apt_cacher_ng_clients | select('match', '^(127[.]|::1$|localhost$)') | list | length == 0
          - (apt_cacher_ng_direct_hosts + apt_cacher_ng_pass_through_hosts) | select('search', '[^A-Za-z0-9.-]') | list | length == 0
          - >-
            'control' in group_names
            or apt_cacher_ng_url | urlsplit('hostname') is not match('^(127[.]|::1$|localhost$)')
        fail_msg: >-
          apt_cacher_ng_clients needs a name or address for each entry
          (each [worker] host needs ansible_host), and not a loopback
          one. apt_cacher_ng_direct_hosts and
          apt_cacher_ng_pass_through_hosts take host names or IPv4
          addresses only, so janitor_domain must be one too. A worker on
          a host that is not in [control] needs an apt_cacher_ng_url
          that is not loopback.
        quiet: true
      when: enable_apt_cacher_ng | bool

    - name: Check monitoring has a Grafana admin password
      ansible.builtin.assert:
        that:
          - grafana_admin_password | default('') | string | length > 0
          - not (grafana_admin_password | default('') | string | regex_search("['\"\\s]"))
        fail_msg: enable_monitoring needs grafana_admin_password, with no quotes or whitespace.
        quiet: true
      when:
        - enable_monitoring | bool
        - "'control' in group_names"

- name: Deploy the janitor control services
  hosts: control
  become: true
  roles:
    - base
    # Clones the source. roles/postgres loads schema/*.sql from it.
    - janitor_source
    - postgres
    - redis
    - caddy
    - { role: archive_signing_key, when: "'archive' in janitor_services" }
    - { role: gitea, when: enable_gitea | bool }
    # Before janitor_config, which writes the S3 key Garage hands it.
    - { role: garage, when: enable_garage | bool }
    - { role: jaeger, when: enable_tracing | bool }
    - { role: auto_upload_target, when: enable_auto_upload | bool and enable_auto_upload_target | bool }
    # Before janitor_quadlet, which makes the sbuild chroot through it.
    - { role: apt_cacher_ng, when: enable_apt_cacher_ng | bool }
    - janitor_config
    - janitor_quadlet
    - { role: mail_filter, when: enable_mail_filter | bool }
    - { role: mta, when: enable_mta | bool }
    - host_metrics
    - { role: monitoring, when: enable_monitoring | bool }

- name: Deploy the janitor workers (the control play already covers a host in both groups)
  hosts: worker:!control
  become: true
  roles:
    - base
    # Before janitor-worker starts listening.
    - worker_firewall
    - host_metrics
    - janitor_source
    - janitor_config
    - janitor_quadlet
