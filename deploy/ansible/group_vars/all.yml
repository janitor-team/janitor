---
# Deployment variables. Secret values are never written here: pass them
# with ansible-vault or -e, for example:
#   ansible-playbook site.yml --ask-vault-pass -e @~/janitor-secrets.yml
#
# Required secrets:
#   janitor_db_password  password of the "janitor" PostgreSQL role
#   worker_password      password the worker logs in to the runner with
#   breezy_whoami        "Name <email>", the commit author the worker uses
# Optional secrets:
#   breezy_github_token  GitHub token publish pushes and opens pull
#                        requests with (repo and workflow scopes), and the
#                        runner lists proposals with it. Not given to the worker
#   oauth_client_id      OAuth2 client for the site login, or omit both
#   oauth_client_secret  to run the site without login
# With a login, also set oauth_base_url (an OpenID Connect provider,
# which GitHub is not), oauth_qa_reviewer_group and oauth_admin_group
# (OpenID groups).

janitor_repo: https://github.com/janitor-team/janitor.git
janitor_branch: main
janitor_home: "/home/{{ ansible_user }}/janitor"
janitor_domain: CHANGEME        # e.g. janitor.example.com
janitor_github_org: CHANGEME    # GitHub user or org the bot works as
# HSTS max-age in seconds; browsers keep it that long.
caddy_hsts_max_age: 31536000
# A self-signed certificate instead of one Caddy gets for janitor_domain, for test hosts.
caddy_self_signed: false
# The worker reaches the runner, git_store and bzr_store through Caddy here.
janitor_external_url: "https://{{ janitor_domain }}/"
# The build chroots read the apt repository over plain HTTP: they have no
# CA certificates. Caddy serves only the repository there, no login.
janitor_apt_archive_url: "http://{{ janitor_domain }}/"

# The worker's row in the worker table, with worker_password.
worker_name: worker-1

# The distribution janitor.conf builds on, and the sbuild chroot tarball
# made from it.
janitor_distribution: unstable
janitor_archive_mirror: http://deb.debian.org/debian
# The lintian-fixes campaign's build distribution, also in the worker's sbuild chroot name.
janitor_lintian_fixes_build_distribution: lintian-fixes

# Named publish policies the playbook makes through publish:
# {name: {branch role: {mode: <publish_mode in schema/state.sql>}}}.
# A candidate publishes when its "publish-policy" names one of these.
janitor_publish_policies:
  propose:
    main: {mode: propose}
  build-only:
    main: {mode: build-only}

# A directory of merge proposal templates on the machine running
# ansible-playbook (<campaign>.md and <campaign>.txt), or empty.
janitor_proposal_templates: ""

# The services, in start order. Each has a Dockerfile_<name> image.
janitor_services:
  - git_store
  - bzr_store
  - differ
  - archive
  - runner
  - publish
  - site
  - worker
# Services that use Breezy each get their own config dir under here.
janitor_breezy_dir: "/home/{{ ansible_user }}/.config/janitor-breezy"
janitor_breezy_services: [runner, publish, worker]
# The bot's SSH key and pinned host keys. Only publish mounts this directory.
janitor_ssh_dir: "/home/{{ ansible_user }}/.config/janitor-ssh"

# false: build the images from this host's checkout (make build-<name>).
# true: pull ghcr.io/jelmer/janitor/<name>:latest instead of building
# janitor_branch.
use_prebuilt_images: false

# sbuild's own unshare-mode tarball, made from janitor_distribution.
janitor_sbuild_chroot: "{{ janitor_distribution }}-amd64-sbuild"
# sbuild finds a campaign's chroot by <build_distribution>-amd64-sbuild.
janitor_sbuild_chroot_aliases:
  - "{{ janitor_lintian_fixes_build_distribution }}-amd64-sbuild"
  - unchanged-amd64-sbuild
# The published worker image has no codemods (docs/production.md, "Worker
# images"). List the packages your campaigns need and the playbook builds
# a derived image with them.
janitor_worker_extra_packages: []
janitor_worker_image: >-
  {{ 'localhost/janitor-worker-custom:latest' if janitor_worker_extra_packages | length > 0
     else 'ghcr.io/jelmer/janitor/worker:latest' }}

# Health routes the playbook waits for after starting each service.
janitor_health_urls:
  git_store: "http://{{ janitor_listen_address }}:9923/health"
  bzr_store: "http://{{ janitor_listen_address }}:9929/health"
  differ: "http://{{ janitor_listen_address }}:9920/health"
  archive: "http://{{ janitor_listen_address }}:9914/health"
  runner: "http://{{ janitor_listen_address }}:9911/health"
  publish: "http://{{ janitor_listen_address }}:9912/health"
  site: "http://{{ janitor_listen_address }}:8080/health"
  worker: "http://{{ janitor_listen_address }}:9821/health"
