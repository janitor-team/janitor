---
# Only for the local test VMs (../Vagrantfile, ../Vagrantfile.multi-host).
# Every secret here is a fake, local-only value. The Vagrantfiles pass
# janitor_domain and the worker addresses as extra vars.
janitor_scheme: http
caddy_self_signed: true
janitor_github_org: vagrant-test

janitor_db_password: vagrant-dev-only-db
worker_password: vagrant-dev-only-worker
breezy_whoami: "Vagrant Test Bot <vagrant-test@example.invalid>"

# Every VM in [worker] is a worker named after itself.
worker_name: "{{ inventory_hostname }}"
janitor_workers: >-
  {{ groups['worker'] | map('regex_replace', '^(.*)$', '{"name": "\1"}') | map('from_json')
     | map('combine', {'password': worker_password}) | list }}

# The lintian-fixes campaign needs lintian-brush on the worker.
janitor_worker_extra_packages: [lintian-brush]
