---
# Applied only to hosts in [control] (see ../inventory.ini) - the runner,
# site, postgres, redis, etc., everything except the worker itself (see
# group_vars/worker.yml). Same list as group_vars/all.yml's own
# janitor_services default minus "worker".
#
# 'worker' not in group_names guards every var below: Ansible resolves
# same-depth group_vars files alphabetically when a host is in more than
# one group ("control" before "worker"), so group_vars/worker.yml's own
# same-named overrides would otherwise win outright for a host in both
# groups - the single-host default (one host in both [control] and
# [worker], see ../inventory.ini). Confirmed live with `ansible-inventory
# --host` against that exact inventory shape before this guard existed:
# janitor_services resolved to ["worker"] only (git_store/differ/runner/
# site/etc. never got a quadlet unit) and every address below resolved to
# the literal string "CHANGEME", not group_vars/all.yml's loopback
# defaults. The guard restores this file's own stated intent - apply for
# a genuinely control-only split host (docs/multi-host-deployment.md),
# fall through to group_vars/all.yml's single-host values otherwise.
janitor_services: >-
  {{ ['git_store', 'bzr_store', 'differ', 'archive', 'auto_upload', 'runner', 'publish']
     + (['worker'] if 'worker' in group_names else [])
     + ['site'] }}

# Only meaningful when [worker] is a different host from this one - see
# group_vars/all.yml for what each of these actually controls and for the
# loopback/localhost literals repeated below (duplicated rather than
# referenced - a var can't fall back to a lower-precedence definition of
# its own name from inside a same- or higher-precedence one).
# this host's address, reachable from the worker host
git_store_bind_address: "{{ 'CHANGEME' if 'worker' not in group_names else '127.0.0.1' }}"
# same address, as the worker host resolves it
git_store_public_address: "{{ 'CHANGEME' if 'worker' not in group_names else 'localhost' }}"
# this host's address, reachable from the worker host
runner_bind_address: "{{ 'CHANGEME' if 'worker' not in group_names else '127.0.0.1' }}"
