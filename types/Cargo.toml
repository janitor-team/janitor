[package]
name = "janitor-types"
version = { workspace = true }
authors = ["Jelmer Vernooĳ <jelmer@jelmer.uk>"]
edition.workspace = true
description = "Core types shared between the janitor crates"
license = "GPL-3.0+"
repository = "https://github.com/jelmer/janitor.git"
homepage = "https://github.com/jelmer/janitor"

[dependencies]
breezyshim = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
debversion = { workspace = true, optional = true, features = ["serde"] }
pyo3 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = "3.9.0"
silver-platter = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
url = { workspace = true, features = ["serde"] }
utoipa = { workspace = true, optional = true }

[features]
default = []
breezyshim = ["dep:breezyshim"]
debian = ["dep:debversion"]
pyo3 = ["dep:pyo3"]
silver-platter = ["dep:silver-platter"]
sqlx = ["dep:sqlx"]
utoipa = ["dep:utoipa"]
