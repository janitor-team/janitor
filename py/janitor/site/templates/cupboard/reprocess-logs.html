{% extends "layout.html" %}
{% block sidebar %}
    {% include "cupboard/sidebar.html" %}
{% endblock sidebar %}
{% block page_title %}
    Cupboard - Reprocess logs
{% endblock page_title %}
{% block body %}
    <h1>Reprocess logs</h1>
    <form id="mass_reschedule"
          method="post"
          action="/cupboard/api/reprocess-logs">
        <label for="dry-run">
            <input type="checkbox" name="dry_run" id="dry-run" value="1" />
            Dry run
        </label>
        <label for="reschedule">
            <input type="checkbox" name="reschedule" id="reschedule" value="1" />
            Reschedule
        </label>
        <input type="submit" value="Reprocess logs" />
    </form>
{% endblock body %}
