{% macro reprocess_logs_button(run_id, title="Reprocess logs", id="reprocess-logs", accesskey="l") %}
    <button id="{{ id }}"
            {% if accesskey %}accesskey="{{ accesskey }}"{% endif %}>{{ title }}</button>
    <script>
        $(function() {
            $("#{{ id }}").click(function() {
                $.post('/cupboard/api/run/{{ run_id }}/reprocess-logs', {}, function(data) {
                        if (data['changed']) {
                            replaceWithStatus("#{{ id }}", "Logs reprocessed and analysis updated.");
                        } else {
                            replaceWithStatus("#{{ id }}", "Logs reprocessed but no changes made.");
                        }
                    }, 'json')
                    .fail(function(response) {
                        replaceWithStatus("#{{ id }}", "Failed to reprocess logs: " + response.responseText);
                    });
            });
        });
    </script>
{% endmacro %}
