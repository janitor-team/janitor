<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>Janitor -
            {% block page_title %}
            {% endblock page_title %}
        </title>
        <link rel="stylesheet" href="{{ site_root }}/_static/alabaster.css" type="text/css" />
        <link rel="stylesheet" href="{{ site_root }}/_static/lintian.css" type="text/css" />
        <link rel="author" title="About these documents" href="{{ site_root }}/about" />
        <link rel="stylesheet" href="{{ site_root }}/_static/typeahead.css" type="text/css" />
        <link rel="stylesheet" href="{{ site_root }}/_static/pygments.css" type="text/css" />
        <link rel="stylesheet" href="{{ site_root }}/_static/datatables.css" type="text/css" />
        <meta name="viewport"
              content="width=device-width, initial-scale=0.9, maximum-scale=0.9" />
    </head>
    <body>
        <script src="{{ site_root }}/_static/jquery.js"></script>
        <script src="{{ site_root }}/_static/jquery.typeahead.js"></script>
        <script src="{{ site_root }}/_static/jquery.datatables.js"></script>
        <script src="{{ site_root }}/_static/moment.js"></script>
        <script src="{{ site_root }}/_static/chart.js"></script>
        <script src="{{ site_root }}/_static/janitor.js"></script>
        {% include "analytics.html" ignore missing without context %}
        <div class="{% if layout != 'plain' %}document{% else %}plain-document{% endif %}">
            {% block sidebar %}
            {% endblock sidebar %}
            {% if layout != 'plain' %}
                <div class="documentwrapper">
                    <div class="bodywrapper">
                    {% endif %}
                    <div class="body">
                        <main>
                            {% block body %}
                            {% endblock body %}
                        </main>
                    </div>
                    {% if layout != 'plain' %}
                    </div>
                </div>
            {% endif %}
        </div>
        {% include "footer.html" %}
    </body>
</html>
