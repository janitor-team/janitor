{% from "inputs.html" import codebase_input %}
<div class="sphinxsidebar" role="navigation" aria-label="main navigation">
    <div class="sphinxsidebarwrapper">
        <h1 class="logo">
            <a href="{{ site_root }}/">Janitor</a>
        </h1>
        <h3>
            <a href="{{ site_root }}/{{ campaign }}/">{{ campaign }}</a>
        </h3>
        {% if user %}
            Logged in as {{ user['name'] }}
            <form action="{{ site_root }}/logout" method="post">
                <input type="submit" value="Log out" />
            </form>
        {% else %}
            {% include "login.html" %}
        {% endif %}
        <ul class="current">
            <li class="toctree-l1">
                <a class="reference internal" href="{{ site_root }}/{{ campaign }}/merge-proposals">Merge proposals</a>
            </li>
            <li class="toctree-l1">
                <a class="reference internal" href="{{ site_root }}/{{ campaign }}/ready">Ready changes</a>
            </li>
            <li class="toctree-l1">
                <a class="reference internal" href="{{ site_root }}/{{ campaign }}/done">Merged or pushed changes</a>
            </li>
            <li class="toctree-l1">
                <a class="reference internal" href="{{ site_root }}/{{ campaign }}/candidates">Candidates</a>
            </li>
        </ul>
        <p>
            <label for="sidebar-codebase">See the status for a specific package:</label>
            <form autocomplete="off" action="{{ site_root }}/{{ campaign }}/c">
                <div class="sidebar-packages" style="width:300px;">{{ codebase_input(name="package") }}</div>
                <input type="submit" style="display: none" />
            </form>
        </p>
    </div>
</div>
