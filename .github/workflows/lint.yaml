---
name: Linting

"on":
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'    # Daily 6AM UTC build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    # Steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: YAML style checks (yamllint)
        if: always()
        run: |
          set -x
          pip3 install --break-system-packages --upgrade \
            yamllint
          make yamllint

  djlint:
    name: HTML Lint
    runs-on: ubuntu-latest

    # Steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HTML style checks (djLint)
        if: always()
        run: |
          set -x
          PIN=$(python3 -c '
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))
          deps = deps["project"]["optional-dependencies"]["lint"]
          print(next(d for d in deps if d.startswith("djlint")))
          ')
          pip3 install --break-system-packages --upgrade "$PIN"
          make djlint

  codespell:
    name: Check common misspellings
    runs-on: ubuntu-latest

    # Steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check common misspellings (codespell)
        if: always()
        run: |
          set -x
          pip3 install --break-system-packages --upgrade \
            codespell
          codespell

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest

    # Steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shell script checks (shellcheck)
        if: always()
        run: |
          set -x
          make shellcheck

  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            expected="Signed-off-by: ${author_name} <${author_email}>"
            trailers=$(git show -s --format='%(trailers:key=Signed-off-by)' \
              "$sha")
            if ! printf '%s\n' "$trailers" | grep -Fxq "$expected"; then
              echo "Commit $sha is missing a matching Signed-off-by trailer."
              echo "  Author:   ${author_name} <${author_email}>"
              echo "  Expected: ${expected}"
              echo "  Found trailers:"
              printf '%s\n' "$trailers" | sed 's/^/    /'
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "See CONTRIBUTING.md for how to sign off (git commit -s)."
            exit 1
          fi
