---
name: Rust build

"on":
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      # Fail loudly if the Redis testcontainer can't start (e.g. docker
      # broken on the runner) instead of silently skipping tests.
      TEST_REQUIRE_REDIS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt -y install devscripts libapt-pkg-dev libtdb-dev libssl-dev \
            pkg-config libgpgme-dev protobuf-compiler diffoscope nettle-dev
      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools_rust setuptools
      - name: Install breezy, diffoscope
        run: python -m pip install --upgrade "breezy<4" diffoscope jsondiff \
            "brz-debian@git+https://github.com/breezy-team/breezy-debian"
      # TODO(jelmer): Add proper test isolation so this isn't necessary
      - name: Setup bzr identity
        run: brz whoami "CI <ci@noreply.github.com>"
      - name: Verify docker daemon is reachable
        run: docker info
      - name: Build
        run: cargo build --verbose --workspace
      - name: Run tests
        run: cargo test --verbose --workspace
      - name: Run runner integration tests explicitly
        # The dev-dep on janitor-runner already enables the `testing`
        # feature, so `cargo test --workspace` covers this; the
        # explicit `-p janitor-runner --features testing` invocation
        # protects against a future refactor that drops the dev-dep
        # self-reference and silently loses the Redis/pg-backed
        # integration tests.
        run: cargo test --verbose -p janitor-runner --features testing

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: |
          sudo apt -y update
          sudo apt -y install rustfmt cargo
      - name: Check formatting
        run: cargo fmt --all -- --check

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt -y install devscripts libapt-pkg-dev libtdb-dev libssl-dev \
            pkg-config libgpgme-dev protobuf-compiler diffoscope nettle-dev
      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools_rust setuptools
      - name: Install breezy
        run: python -m pip install --upgrade "breezy<4" \
            "brz-debian@git+https://github.com/breezy-team/breezy-debian"
      - name: Clippy on runner
        # Warnings only; the workspace still has legacy warnings the
        # runner port is not the right place to fix. New code should
        # aim to keep this list from growing.
        run: |
          cargo clippy -p janitor-runner --features testing \
            --lib --bins --tests
