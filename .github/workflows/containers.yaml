---
name: Containers - Build and push images

"on":
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # Daily 6AM UTC build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Push
    # https://github.com/actions/runner-images
    runs-on: ubuntu-latest
    # Publish under vars.GHCR_OWNER when set (see issue #1329: janitor-team
    # org lacks package-creation permission, so we override to "jelmer"),
    # else fall back to the current repository owner (works for forks).
    env:
      GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}

    strategy:
      matrix:
        dockerfile_suffix:
          - 'archive'
          - 'auto_upload'
          - 'bzr_store'
          - 'differ'
          - 'git_store'
          - 'mail_filter'
          - 'ognibuild_dep'
          - 'publish'
          - 'runner'
          - 'site'
          - 'worker'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      # Image refs must be lowercase; owner/repo names may not be.
      - name: Determine image base
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          IMAGE_BASE="ghcr.io/${GHCR_OWNER}/${REPO_NAME}"
          echo "IMAGE_BASE=${IMAGE_BASE,,}" | tee -a "$GITHUB_ENV"

      - name: Determine image tags to set
        run: |
          set -x
          TAGS="latest"
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            TAGS="${TAGS} ${{ github.sha }}"
            TAGS="${TAGS} $(echo -n ${{ github.ref_name }} | tr / -)"
          elif [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            TAGS="${TAGS} ${{ github.sha }}"
          elif [[ '${{ github.event_name }}' == 'schedule' ]]; then
            TAGS="${TAGS} nightly"
          else
            echo "Skipping tags: ${{ github.event_name }}" 1>&2
            exit 1
          fi
          echo "TAGS=${TAGS}" | tee -a $GITHUB_ENV

      - name: Login to GitHub Packages (ghcr.io)
        if: |
          github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Assemble buildah cache args
        env:
          SUFFIX: ${{ matrix.dockerfile_suffix }}
          EVENT: ${{ github.event_name }}
        run: |
          CACHE_REPO="${IMAGE_BASE}/${SUFFIX}-buildcache"
          {
            echo "BUILDAH_CACHE_ARGS<<EOF"
            echo "--cache-from=${CACHE_REPO}"
            if [ "${EVENT}" != "pull_request" ]; then
              echo "--cache-to=${CACHE_REPO}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.dockerfile_suffix }} image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: "Dockerfile_${{ matrix.dockerfile_suffix }}"
          image: ${{ env.IMAGE_BASE }}/${{ matrix.dockerfile_suffix }}
          tags: ${{ env.TAGS }}
          layers: true
          extra-args: ${{ env.BUILDAH_CACHE_ARGS }}

      - name: Test ${{ matrix.dockerfile_suffix }} image
        run: |
          set -x
          tag="$( echo ${{ env.TAGS }} | awk '{print $1}' )"
          suffix="${{ matrix.dockerfile_suffix }}"
          podman run "${{ env.IMAGE_BASE }}/${suffix}:${tag}" --help

      - name: >
          Push ${{ env.container }} image to
          https://github.com/${{ env.GHCR_OWNER }}?\
          tab=packages&repo_name=${{ github.event.repository.name }}
        if: |
          github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
