[package]
name = "janitor-differ"
version = "0.0.0"
authors = ["Jelmer Vernooĳ <jelmer@jelmer.uk>"]
edition.workspace = true
description = "Differ for the janitor"
license = "GPL-3.0+"
repository = "https://github.com/jelmer/janitor.git"
homepage = "https://github.com/jelmer/janitor"

[dependencies]
janitor = { path = ".." }
clap = { optional = true, workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1.41"
serde.workspace = true
shlex.workspace = true
patchkit = "0.3"
axum.workspace = true
sqlx.workspace = true
tempfile.workspace = true
breezyshim = { workspace = true, features = ["sqlx"] }
debversion = { workspace = true, features = ["sqlx"] }
nix = { workspace = true, features = ["resource", "signal", "process"] }
pyo3 = { workspace = true, features = ["auto-initialize"] }
prometheus = "0.14"
thiserror = "2.0"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[features]
cli = ["dep:clap"]
default = ["cli"]

[[bin]]
name = "janitor-differ"
path = "src/main.rs"
required-features = ["cli"]
