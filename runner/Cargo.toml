[package]
name = "janitor-runner"
version.workspace = true
authors = ["Jelmer Vernooĳ <jelmer@jelmer.uk>"]
edition.workspace = true
description = "Runner for the janitor"
license = "GPL-3.0+"
repository = "https://github.com/jelmer/janitor.git"
homepage = "https://github.com/jelmer/janitor"

[dependencies]
percent-encoding = "2.3"
breezyshim = { workspace = true, features = ["sqlx"] }
tokio = { workspace = true, features = ["full"] }
sqlx.workspace = true
sqlx-core.workspace = true
sqlx-postgres.workspace = true
redis = { workspace = true, features = ["aio", "tokio-comp"] }
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
janitor = { path = "..", default-features = false, features = ["debian", "testing"] }
async-trait = "0.1.88"
url.workspace = true
debversion = { workspace = true, optional = true, features = ["sqlx"] }
debian-control = { version = "0.3.13", optional = true }
log.workspace = true
silver-platter = { workspace = true, features = ["debian"] }
reqwest.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
axum = { workspace = true, features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde_with = { version = "3.9.0", features = ["chrono_0_4"] }
uuid = { version = "1.11.0", features = ["v4"] }
base64 = "0.22"
prometheus = "0.14.0"
lazy_static = "1.4"
num_cpus = "1.16"
toml = "0.8"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
hostname = "0.4"
google-cloud-storage = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
thiserror = "2.0"
testcontainers = { version = "0.27", optional = true }
testcontainers-modules = { version = "0.15", features = ["redis"], optional = true }

[dev-dependencies]
janitor-runner = { path = ".", features = ["testing"] }
maplit = { workspace = true }
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1.0", features = ["full"] }
tower-service = "0.3"
tempfile = { workspace = true }
serial_test = "3.1.1"
futures = "0.3"

[features]
default = ["debian", "cli"]
debian = ["janitor/debian", "dep:debversion", "dep:debian-control"]
cli = ["dep:clap"]
gcs = ["dep:google-cloud-storage", "dep:google-cloud-auth", "janitor/gcs"]
gcp = ["gcs", "janitor/gcp"]
# Enables ephemeral test infrastructure (test_utils, testcontainers-based Redis).
# Turned on automatically for tests via the dev-dep on `janitor-runner` above.
testing = ["dep:testcontainers", "dep:testcontainers-modules"]

[[bin]]
name = "janitor-runner"
path = "src/main.rs"
required-features = ["cli"]
