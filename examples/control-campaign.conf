# After each successful run, the runner schedules a run of the "control"
# campaign: a build of the same revision without the change. The differ
# compares the two Debian builds.
campaign {
  name: "control"
  # The runner sets the command of the control runs it schedules.
  command: "true"
  # Build even when the command made no change.
  force_build: true
  debian_build {
    base_distribution: "unstable"
    build_distribution: "unchanged"
    build_suffix: "jan+unchanged"
  }
}
