# A campaign for Debian packages. The worker runs the command in each
# packaging branch, then builds the result with the build_command of the
# distribution named in base_distribution, see janitor.conf.example.
campaign {
  name: "lintian-fixes"
  # The codemod. lintian-brush is not in the published worker image, see
  # "Custom worker tooling" in docs/containers.md.
  command: "lintian-brush"
  branch_name: "lintian-fixes"
  debian_build {
    base_distribution: "unstable"
    # The distribution set in debian/changelog for the build.
    build_distribution: "lintian-fixes"
    # Added to the version in debian/changelog.
    build_suffix: "jan+lint"
  }
}
