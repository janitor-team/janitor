# A campaign for codebases of any kind. The worker runs the command in each
# checkout, then builds and tests the result with ognibuild.
campaign {
  name: "generic"
  # The codemod. "true" makes no change, so with force_build this
  # campaign only builds and tests each codebase.
  command: "true"
  branch_name: "generic"
  # Build even when the command made no change.
  force_build: true
  generic_build {
  }
}
