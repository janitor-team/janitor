[package]
name = "janitor-git-store"
version = "0.1.0"
edition.workspace = true

[lib]

[[bin]]
name = "janitor-git-store"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "json", "query", "macros"] }
base64 = "0.22"
bytes = "1"
clap = { workspace = true, features = ["derive", "env"] }
futures-util = "0.3"
git2 = "0.18"
http = "1.1"
janitor = { path = "..", features = ["otlp"] }
janitor-types = { workspace = true, features = ["pyo3", "sqlx", "utoipa"] }
janitor-service = { workspace = true }
nix = { workspace = true, features = ["signal"] }
metrics = { workspace = true }
pyo3 = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "chrono", "uuid"] }
tera = "1.19"
utoipa.workspace = true
utoipa-axum.workspace = true
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["compression-gzip", "cors", "fs", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
janitor-service = { workspace = true, features = ["testing"] }
# Redeclare janitor with the `testing` feature so integration tests can
# use janitor::schema::CORE_SCHEMA.
janitor = { path = "..", features = ["testing"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
serial_test = "3"
tempfile = "3.19"
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "aws-lc-rs"] }
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.6", features = ["v4"] }
