[package]
name = "janitor"
version = { workspace = true }
authors = ["Jelmer Vernooĳ <jelmer@jelmer.uk>"]
edition = "2021"
description = "Automated VCS change management platform"
license = "GPL-3.0+"
repository = "https://github.com/jelmer/janitor.git"
homepage = "https://github.com/jelmer/janitor"
build = "build.rs"
include = ["src/**/*", "schema/state.sql", "schema/debian/debian.sql", "README.md"]

[dependencies]
breezyshim = { workspace = true, features = ["sqlx"] }
chrono = { workspace = true, features = ["serde"] }
env_logger = { workspace = true }
log = { workspace = true }
protobuf = "3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stackdriver_logger = { version = "0.8", optional = true }
url = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
silver-platter = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "rt-multi-thread"] }
regex = "1.11.0"
lazy-regex = "3.2.0"
fancy-regex = ">=0.17,<0.20"
askama = { workspace = true }
futures = "0.3.30"
sqlx = { workspace = true, features = ["chrono"] }
sqlx-core = { workspace = true, features = ["chrono"] }
sqlx-postgres = { workspace = true, features = ["chrono"] }
async-trait = "0.1.88"
percent-encoding = "2.3.1"
tempfile.workspace = true
bytes = { workspace = true }
flate2 = "1.0.34"
async-compression = { version = "0.4.6", features = ["tokio", "gzip"] }
debversion = { workspace = true, optional = true, features = ["sqlx"] }
reqwest = { workspace = true, features = ["json", "query"] }
debian-control.workspace = true
shlex.workspace = true
prometheus = { version = "0.14.0", features = ["reqwest"] }
buildlog-consultant = { workspace = true }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
redis = { workspace = true }
axum = { workspace = true }
rand = "0.9"
base64 = ">=0.22,<0.24"
pyo3 = { workspace = true, features = ["auto-initialize"] }
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"], optional = true }
# OTLP-over-HTTP: zipkin now accepts OTLP natively, and the dedicated
# zipkin exporter crate is deprecated. http-proto keeps the dep tree
# off tonic/grpc.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
object_store = { version = "0.14", features = ["aws", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
# Self-reference so `cargo test -p janitor` runs the `testing`-gated tests, as in runner/Cargo.toml.
janitor = { path = ".", features = ["testing"] }

[workspace.dependencies]
rslock = { default-features = false, version = "0.7" }
static_assertions = "1.1.0"
debian-changelog = "0.2"
debian-analyzer = "0.160"
debversion = { version = "0.5", features = ["serde", "sqlx"] }
bytes = "1"
tempfile = "3"
redis = { version = "1", features = ["aio", "connection-manager", "tokio-comp"] }
sqlx = { version = "0.9", features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-async-std", "tls-native-tls"] }
sqlx-postgres = { version = "0.9", features = ["chrono", "time"] }
sqlx-core = { version = "0.9", features = ["chrono"] }
pyo3 = "0.30"
reqwest = { version = "0.13", features = ["blocking"] }
pyo3-log = "0.13"
breezyshim = "0.7.31"
#breezyshim = { path = "../breezyshim/trunk" }
log = "0.4"
env_logger = ">=0.10"
serde = "1.0"
serde_json = "1.0"
url = "2"
chrono = "0.4"
clap = { version = "4" }
tokio = "1"
tokio-stream = "0.1"
axum = "0.8"
maplit = "1"
silver-platter = { version = "0.8.6" }
ognibuild = { version = "0.2.21", default-features = false, features = ["debian", "breezy"] }
shlex = ">=1,<3"
buildlog-consultant = "0.2.0"
deb822-lossless = "0.5.6"
debian-control = "0.3.13"
pyo3-filelike = "0.5"
pyo3-async-runtimes = "0.30"
tower = "0.5"
tracing = "0.1"
base64 = "0.22"
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-nettle"] }
nix = ">=0.30,<0.32"
askama = ">=0.15,<0.17"

[build-dependencies]
protobuf-codegen = "3"
protoc-rust = "^2.0"

[workspace]
members = [ "common-py", "differ", "mail-filter", "publish", "runner", "worker" , "bzr-store", "git-store", "site", "site-py" , "archive", "auto-upload", "apt-repository" ]

[workspace.package]
edition = "2021"
version = "0.1.0"

[features]
default = ["gcp", "gcs", "debian"]
debian = ["dep:debversion"]
gcp = ["stackdriver_logger", "gcs"]
gcs = ["object_store/gcp"]
testing = ["sqlx/postgres", "sqlx/runtime-tokio", "sqlx/tls-rustls-aws-lc-rs"]
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[patch.crates-io]
# TODO: Drop once pyo3-log has a release with pyo3 0.30 support
# (https://github.com/vorner/pyo3-log/pull/81).
pyo3-log = { git = "https://github.com/edenhaus/pyo3-log", rev = "064b6dff35ebe9e6e0f98adc5c87018b476843b8" }
